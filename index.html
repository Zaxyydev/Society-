<title>Association</title>
<style>
:root{--bg:#fff;--bg2:#f2f2f7;--tx:#111b21;--tx2:#667781;--line:#e9edef;--acc:#00a884;--blue:#007aff;--in:#fff;--out:#d9fdd3;--bar:rgba(247,247,247,.95);--wpd:#efe7de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b141a;--bg2:#111b21;--tx:#e9edef;--tx2:#8696a0;--line:#222d34;--in:#202c33;--out:#005c4b;--bar:rgba(31,44,52,.95);--wpd:#0b141a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b141a;--bg2:#111b21;--tx:#e9edef;--tx2:#8696a0;--line:#222d34;--in:#202c33;--out:#005c4b;--bar:rgba(31,44,52,.95);--wpd:#0b141a;color-scheme:dark}
html,body{height:100%;margin:0}
body{position:relative;font:16px -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
#app{height:100%;display:flex;flex-direction:column}
#main{flex:1;overflow:auto}
.lt{font-size:34px;font-weight:700;margin:6px 16px 8px;display:flex;justify-content:space-between;align-items:center}
.btn{background:none;border:0;color:var(--blue);font-size:17px;cursor:pointer;padding:6px}
.pill{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-size:16px;font-weight:600;cursor:pointer}
.srch{margin:0 16px 8px;background:var(--bg2);border-radius:10px;padding:8px 12px;border:0;width:calc(100% - 32px);color:var(--tx);font:inherit;outline:0}
.chips{display:flex;gap:8px;padding:0 16px 8px;overflow:auto}
.chip{background:var(--bg2);border:0;border-radius:16px;padding:6px 14px;color:var(--tx2);font:inherit;font-size:14px;white-space:nowrap}
.chip.on{background:rgba(0,168,132,.18);color:var(--acc);font-weight:600}
.item{display:flex;gap:12px;align-items:center;padding:9px 16px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.item:active{background:var(--bg2)}
.item .b{flex:1;min-width:0;border-bottom:1px solid var(--line);padding:6px 0;margin-right:-16px;padding-right:16px}
.t1{font-weight:600;display:flex;align-items:center;gap:4px}
.t2{color:var(--tx2);font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{color:var(--tx2);font-size:12px}
.bdg{background:var(--acc);color:#fff;border-radius:11px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;padding:0 6px;margin-top:4px}
.av{border-radius:50%;object-fit:cover;background:#8696a0;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.ck{width:16px;height:16px;flex:none}
#tabs{display:flex;border-top:1px solid var(--line);background:var(--bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
#tabs button{flex:1;background:none;border:0;padding:7px 0 5px;color:var(--tx2);font-size:10.5px;cursor:pointer}
#tabs button.on{color:var(--acc)}
#tabs span{display:block;font-size:23px}
.ov{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:5}
.hd{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bar);border-bottom:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.hd .t1{flex:1;cursor:pointer}
#msgs{flex:1;overflow:auto;padding:10px 10px 6px;display:flex;flex-direction:column;gap:2px;background:var(--wpd)}
.row{display:flex;flex-direction:column;align-items:flex-start;max-width:82%;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;margin-top:1px}
.row.me{align-self:flex-end;align-items:flex-end}
.bub{background:var(--in);color:var(--tx);padding:6px 9px 4px;border-radius:12px;word-break:break-word;white-space:pre-wrap;box-shadow:0 1px .5px rgba(11,20,26,.13);position:relative}
.me .bub{background:var(--out)}
.bub img,.bub video{max-width:100%;max-height:320px;border-radius:8px;display:block}
.mt{font-size:11px;color:var(--tx2);text-align:right;margin-top:1px;white-space:nowrap}
.q{border-left:4px solid var(--acc);background:rgba(0,0,0,.06);border-radius:6px;padding:3px 8px;margin-bottom:4px;font-size:13px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.stk{font-size:88px;line-height:1.1}
.big{font-size:44px;line-height:1.1}
.sys{align-self:center;background:var(--in);color:var(--tx2);font-size:12.5px;border-radius:10px;padding:4px 10px;margin:6px 0}
.who{font-size:12.5px;font-weight:600;color:var(--acc);display:flex;gap:3px;align-items:center}
.rx{font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:1px 6px;margin-top:-4px;z-index:1}
.comp{display:flex;gap:6px;align-items:flex-end;padding:8px;background:var(--bar);border-top:1px solid var(--line)}
.comp textarea{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:20px;padding:8px 14px;font:inherit;resize:none;max-height:100px;outline:0}
.ic{background:none;border:0;font-size:24px;cursor:pointer;padding:2px 4px;color:var(--tx)}
#pan{height:230px;overflow:auto;background:var(--bg2);padding:8px;display:none}
#pan .g{display:grid;grid-template-columns:repeat(8,1fr);font-size:28px;text-align:center}
#pan .g.s{grid-template-columns:repeat(4,1fr);font-size:58px}
#pan .g span{cursor:pointer;padding:4px}
.pt{display:flex;gap:8px;margin-bottom:6px}
.pt button{border:0;background:var(--bg);color:var(--tx);border-radius:14px;padding:4px 12px}
.sheet{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;flex-direction:column;justify-content:flex-end;padding:12px}
.sheet .c{background:var(--bg);border-radius:14px;overflow:hidden;margin-bottom:8px}
.sheet .c div{padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.sheet .c div:last-child{border:0}
.sheet .rr{display:flex;justify-content:space-around;font-size:30px;padding:10px}
.red{color:#ff3b30}
.form{padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
input.f{border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:10px;padding:11px;font:inherit;width:100%;outline:0}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw b{width:56px;height:80px;border-radius:10px;display:block;cursor:pointer;border:3px solid transparent}
.sw b.on{border-color:var(--acc)}
.sec{padding:10px 16px 0;color:var(--tx2);font-size:13px;text-transform:uppercase}
.card{background:var(--bg);border-radius:12px;margin:8px 16px;padding:12px}
.grp{background:var(--bg);border-radius:12px;margin:10px 16px;overflow:hidden}
#toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:#333;color:#fff;padding:8px 14px;border-radius:14px;z-index:99;font-size:14px;display:none}
.stv{align-items:center;justify-content:center;text-align:center;font-size:28px;padding:24px;color:#fff}
.ring{padding:2px;border-radius:50%;background:linear-gradient(135deg,#25d366,#00a884)}
.ring .av{border:2px solid var(--bg)}
.emp{text-align:center;color:var(--tx2);padding:40px 20px}
.login{align-items:center;justify-content:center;text-align:center;gap:14px;padding:30px}
.login .pill{width:100%;max-width:320px;background:var(--bg2);color:var(--tx)}

#splash{position:absolute;inset:0;z-index:100;background:radial-gradient(circle at 50% 40%,#0b3d33,#04120f 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s}
.logo{width:92px;height:92px;border-radius:26px;background:linear-gradient(145deg,#25d366,#00796b);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 40px rgba(37,211,102,.35);animation:pop .8s cubic-bezier(.2,1.4,.4,1) both;position:relative}
.logo svg{width:54px;height:54px}
.logo::after{content:"";position:absolute;inset:-6px;border-radius:32px;border:2px solid rgba(37,211,102,.5);animation:ring 1.8s ease-out infinite}
.wm{color:#fff;font-size:30px;font-weight:700;letter-spacing:.5px;animation:rise .7s .35s both}
.mono{font:13px ui-monospace,Menlo,monospace;color:#6ee7b7;opacity:.85;animation:rise .7s .55s both}
@keyframes pop{from{transform:scale(.3) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@keyframes ring{from{transform:scale(.9);opacity:.9}to{transform:scale(1.5);opacity:0}}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.lg{background:radial-gradient(circle at 50% 0,#0b3d33,#04120f 65%);color:#fff;align-items:center;justify-content:center;overflow:auto;z-index:50}
.lg::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:32px 32px;-webkit-mask-image:radial-gradient(circle at 50% 30%,#000,transparent 75%);mask-image:radial-gradient(circle at 50% 30%,#000,transparent 75%)}
.lgc{position:relative;width:100%;max-width:340px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;animation:rise .6s both}
.lgc h1{margin:6px 0 0;font-size:32px;letter-spacing:.5px}
.lgc p{margin:0 0 8px;color:#a7f3d0;opacity:.85}
.ob{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:14px;padding:13px;font:inherit;font-weight:600;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.ob:active{transform:scale(.98)}
.ob svg{width:22px;height:22px}
.saved{width:100%;display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#00a884,#047857);border:0;color:#fff;border-radius:16px;padding:12px;font:inherit;text-align:left;cursor:pointer;box-shadow:0 8px 24px rgba(0,168,132,.35)}
.saved .sa{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:700;flex:none}
.saved .sa img{width:100%;height:100%;object-fit:cover}
.saved span:nth-child(2){flex:1;min-width:0}
.saved small{display:block;opacity:.8}
.saved i{font-style:normal;opacity:.7;padding:6px}
.feat{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.feat span{font-size:12px;border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:3px 10px;color:#a7f3d0}
.lgc small{color:#6ee7b7;opacity:.7;font:12px ui-monospace,Menlo,monospace}
.wel{position:absolute;inset:0;z-index:90;background:linear-gradient(160deg,#00a884,#04382f);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .5s;animation:fade .4s both;text-align:center;font-size:24px}
.wel .av{animation:pop .8s cubic-bezier(.2,1.4,.4,1) both;border:4px solid rgba(255,255,255,.6)}
.wel .wt{animation:rise .7s .4s both}

.intro video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

const oauth=p=>sb.auth.signInWithOAuth({provider:p,options:{redirectTo:location.origin+location.pathname}});
sb.auth.onAuthStateChange((ev,s)=>{
  if(s&&s.user){if(!me||me.id!==s.user.id){me=s.user;setTimeout(start,0)}}
  else if(ev==='INITIAL_SESSION'||ev==='SIGNED_OUT'){me=null;booted=false;loginUI()}
});

/* ---------- data ---------- */
async function loadAll(){
  const [p,mb,ch,ms,st]=await Promise.all([sb.from('profiles').select('*'),sb.from('members').select('*'),sb.from('chats').select('*'),sb.from('messages').select('*').order('created_at',{ascending:false}).limit(600),sb.from('statuses').select('*').order('created_at',{ascending:false})]);
  P={};(p.data||[]).forEach(x=>P[x.id]=x);C={};(ch.data||[]).forEach(x=>C[x.id]=x);
  MB={};(mb.data||[]).forEach(x=>(MB[x.chat_id]=MB[x.chat_id]||[]).push(x));
  M=(ms.data||[]).reverse();S=st.data||[];
}
let rl;const reload=()=>{clearTimeout(rl);rl=setTimeout(async()=>{await loadAll();render();if(cur)renderMsgs()},250)};
function addMsg(m){if(!M.find(x=>x.id===m.id)){M.push(m);M.sort((a,b)=>tm(a.created_at)-tm(b.created_at))}render();if(cur){renderMsgs();if(cur===m.chat_id)markRead(cur)}}
async function start(){
  await loadAll();isOwner=(await sb.rpc('is_owner')).data===true;
  document.querySelectorAll('#login').forEach(e=>e.remove());
  if(booted)return;booted=true;
  sb.channel('db').on('postgres_changes',{event:'*',schema:'public',table:'messages'},e=>{
    if(e.eventType==='INSERT')addMsg(e.new);
    else if(e.eventType==='UPDATE'){M=M.map(x=>x.id===e.new.id?e.new:x);render();if(cur)renderMsgs()}
    else{M=M.filter(x=>x.id!==e.old.id);render();if(cur)renderMsgs()}
  }).on('postgres_changes',{event:'*',schema:'public',table:'members'},reload).on('postgres_changes',{event:'*',schema:'public',table:'statuses'},reload).on('postgres_changes',{event:'*',schema:'public',table:'profiles'},reload).subscribe();
  sb.channel('call-'+me.id).on('broadcast',{event:'sig'},({payload})=>sig(payload)).subscribe();
  applyTheme();render();saveAcct();hideSplash();welcome();
}
const myMem=id=>(MB[id]||[]).find(m=>m.user_id===me.id);
const otherOf=id=>{const o=(MB[id]||[]).find(m=>m.user_id!==me.id);return o?o.user_id:me.id};
function cav(id,z){const c=C[id];return c.is_group?`<div class="av" style="width:${z}px;height:${z}px;font-size:${z*.5}px">${esc(c.icon||'👥')}</div>`:av(otherOf(id),z)}
const ctitle=id=>C[id].is_group?esc(C[id].name):nm(otherOf(id));
const prev=x=>!x?'':({text:x.body,sticker:'Stiker',image:'📷 Foto',video:'🎥 Video',call:'📞 '+x.body}[x.type]||x.body||'');
const tk=x=>{if(x.sender_id!==me.id||x.type==='call')return '';const o=(MB[x.chat_id]||[]).find(m=>m.user_id!==me.id),rd=C[x.chat_id]&&!C[x.chat_id].is_group&&o&&tm(o.last_read)>=tm(x.created_at);return `<span style="color:${rd?'#53bdeb':'var(--tx2)'}">✓✓</span>`};
function rows(){
  return Object.keys(C).map(id=>{const mm=myMem(id);if(!mm)return null;const ms=M.filter(x=>x.chat_id===id),l=ms[ms.length-1],un=ms.filter(x=>x.sender_id!==me.id&&tm(x.created_at)>tm(mm.last_read)).length;return{id,mm,l,un,t:tm(l?l.created_at:C[id].created_at)}}).filter(Boolean).sort((a,b)=>(b.mm.pinned-a.mm.pinned)||b.t-a.t)
}
async function markRead(id){const mm=myMem(id);if(!mm)return;mm.last_read=new Date().toISOString();await sb.from('members').update({last_read:mm.last_read}).match({chat_id:id,user_id:me.id})}

/* ---------- render ---------- */
function render(){
  if(!me||!booted)return;
  if(!P[me.id]){profileForm(true);return}
  const T=[['status','◎','Pembaruan'],['chat','💬','Chat'],['people','👥','Orang'],['set','⚙️','Pengaturan']];
  $('#tabs').innerHTML=T.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render()"><span>${t[1]}</span>${t[2]}</button>`).join('');
  const m=$('#main');
  if(tab==='chat'){
    if(!$('#cl')||m.dataset.t!=='chat'){m.dataset.t='chat';m.innerHTML=`<div class="lt">Chat <button class="btn" onclick="groupForm()">＋ Grup</button></div><input class="srch" id="sq" placeholder="Tanya Meta AI atau cari" value="${esc(q)}" oninput="q=this.value;fill()"><div class="chips">${[['all','Semua'],['unread','Belum dibaca'],['group','Grup'],['arch','Arsip']].map(c=>`<button class="chip" data-c="${c[0]}" onclick="chip='${c[0]}';fill()">${c[1]}</button>`).join('')}</div><div id="cl"></div>`}
    fill();
  }else{m.dataset.t=tab;if(tab==='status')statusTab(m);else if(tab==='people')peopleTab(m);else setTab(m)}
}
function fill(){
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.c===chip));
  let L=rows().filter(r=>chip==='arch'?r.mm.archived:!r.mm.archived);
  if(chip==='unread')L=L.filter(r=>r.un);if(chip==='group')L=L.filter(r=>C[r.id].is_group);
  if(q)L=L.filter(r=>ctitle(r.id).toLowerCase().includes(q.toLowerCase()));
  const box=$('#cl');
  box.innerHTML=L.length?L.map(r=>`<div class="item" data-id="${r.id}">${cav(r.id,52)}<div class="b"><div class="t1">${ctitle(r.id)}</div><div class="t2">${r.l?tk(r.l)+' ':''}${esc(prev(r.l))||'Belum ada pesan'}</div></div><div style="text-align:right;padding-bottom:6px"><div class="time" style="color:${r.un?'var(--acc)':'var(--tx2)'}">${hhmm(r.t)}</div>${r.un?`<span class="bdg">${r.un}</span>`:''}${r.mm.pinned?' 📌':''}${r.mm.muted?' 🔕':''}</div></div>`).join(''):'<div class="emp">Belum ada chat.<br>Buka tab Orang buat mulai ngobrol.</div>';
  box.querySelectorAll('.item').forEach(e=>{const id=e.dataset.id;e.onclick=()=>{if(e._lp){e._lp=0;return}openChat(id)};lp(e,()=>chatMenu(id))});
}
function chatMenu(id){
  const mm=myMem(id),u=(f)=>async()=>{Object.assign(mm,f);await sb.from('members').update(f).match({chat_id:id,user_id:me.id});fill()};
  sheet([['Tandai dibaca',()=>{markRead(id).then(fill)}],[mm.pinned?'Lepas sematan':'Sematkan',u({pinned:!mm.pinned})],[mm.muted?'Nyalakan notifikasi':'Bisukan',u({muted:!mm.muted})],[mm.archived?'Keluarkan dari arsip':'Arsipkan',u({archived:!mm.archived})],['Hapus chat',async()=>{await sb.from('members').delete().match({chat_id:id,user_id:me.id});delete MB[id];delete C[id];fill()},'red']]);
}
function peopleTab(m){
  const L=Object.keys(P).filter(i=>i!==me.id);
  m.innerHTML='<div class="lt">Orang</div>'+(L.length?L.map(i=>`<div class="item" data-o="${i}">${av(i,48)}<div class="b"><div class="t1">${nm(i)}</div><div class="t2">@${esc(P[i].username)}</div></div>${isOwner?`<button class="btn" data-v="${i}">${P[i].verified?'Cabut ✓':'Beri ✓'}</button>`:''}</div>`).join(''):'<div class="emp">Belum ada user lain. Bagikan link app ini ke temen lu.</div>');
  m.querySelectorAll('.item').forEach(e=>e.onclick=async ev=>{const v=ev.target.closest('[data-v]');if(v){ev.stopPropagation();const r=await sb.from('profiles').update({verified:!P[v.dataset.v].verified}).eq('id',v.dataset.v);if(r.error)toast('Cuma owner yang bisa');else reload();return}
    const r=await sb.rpc('create_dm',{other:e.dataset.o});if(r.error)return toast('Gagal buka chat');await loadAll();openChat(r.data)});
}

/* ---------- chat ---------- */
function openChat(id){
  cur=id;replyTo=null;markRead(id);
  const o=document.createElement('div');o.className='ov';o.id='chat';
  o.innerHTML=`<div class="hd"><button class="btn" onclick="closeChat()">‹ Chat</button>${cav(id,36)}<div class="t1" onclick="info()">${ctitle(id)}</div><button class="ic" onclick="call(1)">🎥</button><button class="ic" onclick="call(0)">📞</button></div><div id="sb" style="display:none;padding:6px;background:var(--bar)"><input class="f" id="qi" placeholder="Cari pesan" oninput="renderMsgs()"></div><div id="msgs"></div><div id="rb"></div><div id="pan"></div><div class="comp"><button class="ic" onclick="attach()">＋</button><textarea id="ti" rows="1" placeholder="Pesan"></textarea><button class="ic" onclick="panel()">😊</button><button class="ic" style="color:var(--acc)" onclick="sendT()">➤</button></div>`;
  document.body.appendChild(o);$('#msgs').style.background=WP[pref.wp][1];
  $('#ti').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendT()}});
  renderMsgs(true);
}
function closeChat(){if(cur)markRead(cur).then(()=>{if(tab==='chat')fill()});cur=null;const c=$('#chat');if(c)c.remove()}
function renderMsgs(force){
  const box=$('#msgs');if(!box||!cur)return;const qq=($('#qi')||{}).value||'';
  const near=force||box.scrollHeight-box.scrollTop-box.clientHeight<120,grp=C[cur].is_group;
  const list=M.filter(x=>x.chat_id===cur&&(!qq||(x.body||'').toLowerCase().includes(qq.toLowerCase())));
  box.innerHTML=list.map(x=>{
    if(x.type==='call')return `<div class="sys">📞 ${esc(x.body)}</div>`;
    const mine=x.sender_id===me.id,rp=x.reply_to&&M.find(y=>y.id===x.reply_to);let body;
    const meta=`<div class="mt">${hhmm(x.created_at)} ${tk(x)}</div>`;
    if(x.type==='sticker')body=`<div class="stk">${esc(x.body)}</div>`;
    else if(x.type==='image')body=`<div class="bub" style="padding:3px"><img src="${esc(x.media_url)}">${meta}</div>`;
    else if(x.type==='video')body=`<div class="bub" style="padding:3px"><video src="${esc(x.media_url)}" controls playsinline></video>${meta}</div>`;
    else if(/^(\p{Extended_Pictographic}|\uFE0F|\u200D|\s){1,8}$/u.test(x.body||'x'))body=`<div class="big">${esc(x.body)}</div>`;
    else body=`<div class="bub">${grp&&!mine?`<div class="who">${nm(x.sender_id)}</div>`:''}${rp?`<div class="q">${esc(prev(rp))}</div>`:''}${esc(x.body)}${meta}</div>`;
    const rs=Object.values(x.reactions||{});
    return `<div class="row ${mine?'me':''}" data-id="${x.id}">${body}${rs.length?`<div class="rx">${esc(rs.join(''))}</div>`:''}</div>`}).join('')||'<div class="emp">Mulai ngobrol 👋</div>';
  box.querySelectorAll('.row').forEach(r=>lp(r,()=>msgMenu(r.dataset.id)));
  if(near)box.scrollTop=box.scrollHeight;
}
function msgMenu(id){
  const x=M.find(m=>m.id===id);if(!x)return;
  const rows=[['Balas',()=>{replyTo=id;rbar();$('#ti').focus()}]];
  if(x.type==='text')rows.push(['Salin',()=>{try{navigator.clipboard.writeText(x.body)}catch(e){};toast('Disalin')}]);
  if(x.sender_id===me.id||isOwner)rows.push(['Hapus',async()=>{const r=await sb.from('messages').delete().eq('id',id);if(r.error)toast('Gagal hapus')},'red']);
  const top='<div class="c"><div class="rr">'+['👍','❤️','😂','😮','😢','🙏'].map(e=>`<span data-e="${e}">${e}</span>`).join('')+'</div></div>';
  const s=sheet(rows,top);
  s.querySelectorAll('[data-e]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();s.remove();const r={...(x.reactions||{})};r[me.id]===e.dataset.e?delete r[me.id]:r[me.id]=e.dataset.e;sb.from('messages').update({reactions:r}).eq('id',id).select().single().then(z=>z.data&&(M=M.map(y=>y.id===id?z.data:y),renderMsgs()))});
}
function rbar(){const r=$('#rb');if(!r)return;const x=replyTo&&M.find(m=>m.id===replyTo);r.innerHTML=x?`<div class="comp" style="padding:4px 12px;border-top:0"><div class="q" style="flex:1;max-width:none">${esc(prev(x))}</div><button class="ic" onclick="replyTo=null;rbar()">✕</button></div>`:''}
async function send(o){const r=await sb.from('messages').insert({chat_id:cur,reply_to:replyTo,...o}).select().single();if(r.error)return toast('Gagal kirim');replyTo=null;rbar();addMsg(r.data)}
function sendT(){const t=$('#ti'),v=t.value.trim();if(!v)return;t.value='';send({type:'text',body:v})}
function panel(){
  const p=$('#pan');if(p.style.display==='block'){p.style.display='none';return}p.style.display='block';
  const show=w=>{p.innerHTML=`<div class="pt"><button onclick="panTab('e')">Emoji</button><button onclick="panTab('s')">Stiker</button></div><div class="g ${w==='s'?'s':''}">${(w==='s'?STK:EMO).map(e=>`<span data-e="${e}">${e}</span>`).join('')}</div>`;p.querySelectorAll('[data-e]').forEach(s=>s.onclick=()=>{if(w==='s')send({type:'sticker',body:s.dataset.e});else{const t=$('#ti');t.value+=s.dataset.e;t.focus()}})};
  window.panTab=show;show('e');
}
function attach(){
  const go=(acc,type,ext)=>async()=>{const f=await pick(acc);if(!f)return;toast('Mengunggah...');try{const b=type==='image'?await rz(f,1280,.8):f;send({type,media_url:await upload(b,'chat',type==='image'?'jpg':(f.name.split('.').pop()||'mp4'))})}catch(e){toast('Gagal unggah')}};
  sheet([['Foto',go('image/*','image')],['Video',go('video/*','video')]]);
}

/* ---------- info, group, profile ---------- */
function info(){
  const id=cur,c=C[id],g=c.is_group,o=otherOf(id),mem=MB[id]||[],mm=myMem(id),admin=g&&(mm.role==='admin'||isOwner);
  const md=M.filter(x=>x.chat_id===id&&(x.type==='image'||x.type==='video')).length;
  const R=(a,t,v,cl)=>`<div class="item" data-a="${a}"><div class="b ${cl||''}" style="display:flex;justify-content:space-between"><span>${t}</span><span class="t2">${v||''} ›</span></div></div>`;
  const e=document.createElement('div');e.className='ov';e.style.zIndex=15;
  e.innerHTML=`<div class="hd"><button class="btn" id="x">‹ Kembali</button><div class="t1" style="justify-content:center;margin-right:70px">${g?'Info Grup':'Info Kontak'}</div></div><div style="flex:1;overflow:auto;background:var(--bg2);padding-bottom:24px"><div style="padding:16px;text-align:center"><div style="display:flex;justify-content:center">${cav(id,110)}</div><div style="font-size:24px;font-weight:700;margin-top:8px;display:flex;justify-content:center;gap:4px;align-items:center">${ctitle(id)}</div><div class="t2">${g?'Grup · '+mem.length+' peserta':'@'+esc(P[o]&&P[o].username)}</div></div>
  <div style="display:flex;gap:10px;padding:0 16px">${[['📞','panggilan','call0'],['🎥','video','call1'],['🔍','cari','find']].map(b=>`<div class="card" data-a="${b[2]}" style="flex:1;margin:0;text-align:center;color:var(--blue);cursor:pointer">${b[0]}<br>${b[1]}</div>`).join('')}</div>
  <div class="card">${g?(admin?`<input class="f" id="gd" placeholder="Tambah Deskripsi Grup" value="${esc(c.descr||'')}">`:esc(c.descr||'Belum ada deskripsi')):esc((P[o]&&P[o].bio)||'Tidak ada bio')}</div>
  <div class="grp">${R('media','🖼 Media, Tautan, dan Dok',md||'Tidak Ada')}</div>
  <div class="grp">${R('mute','🔊 Bisukan',mm.muted?'Ya':'Tidak')}</div>
  ${g?`<div class="sec">${mem.length} peserta</div><div class="grp">${mem.map(m=>`<div class="item" style="cursor:default">${av(m.user_id,36)}<div class="b t1">${nm(m.user_id)}${m.role==='admin'?' <span class="t2">Admin</span>':''}</div></div>`).join('')}</div><div class="grp">${R('leave','Keluar dari grup','','red')}</div>`:''}</div>`;
  document.body.appendChild(e);
  const gd=e.querySelector('#gd');if(gd)gd.onchange=()=>sb.from('chats').update({descr:gd.value.trim()}).eq('id',id).then(r=>r.error?toast('Gagal simpan'):(c.descr=gd.value.trim()));
  e.onclick=async ev=>{if(ev.target.id==='x'){e.remove();return}const d=ev.target.closest('[data-a]');if(!d)return;const a=d.dataset.a;
    if(a==='call0'||a==='call1'){e.remove();call(+a[4])}
    else if(a==='find'){e.remove();$('#sb').style.display='block';$('#qi').focus()}
    else if(a==='media')toast(md+' foto/video di chat ini');
    else if(a==='mute'){mm.muted=!mm.muted;await sb.from('members').update({muted:mm.muted}).match({chat_id:id,user_id:me.id});e.remove();info()}
    else if(a==='leave'){await sb.from('members').delete().match({chat_id:id,user_id:me.id});delete C[id];delete MB[id];e.remove();closeChat();render()}};
}
function groupForm(){
  const o=document.createElement('div');o.className='ov';o.style.zIndex=15;const L=Object.keys(P).filter(i=>i!==me.id);
  o.innerHTML=`<div class="hd"><button class="btn" id="x">Batal</button><div class="t1" style="justify-content:center">Grup baru</div><button class="btn" id="ok">Buat</button></div><div class="form"><input class="f" id="gn" placeholder="Nama grup" maxlength="40"><input class="f" id="gi" placeholder="Emoji ikon (opsional)" maxlength="4"><div class="sec">Anggota</div>${L.map(i=>`<label class="item" style="cursor:default">${av(i,36)}<div class="b t1">${nm(i)}</div><input type="checkbox" value="${i}"></label>`).join('')||'<div class="emp">Belum ada user lain</div>'}</div>`;
  document.body.appendChild(o);$('#x').onclick=()=>o.remove();
  $('#ok').onclick=async()=>{const n=$('#gn').value.trim(),ids=[...o.querySelectorAll('input[type=checkbox]:checked')].map(c=>c.value);if(!n||!ids.length)return toast('Isi nama dan pilih anggota');const r=await sb.rpc('create_group',{n,ic:$('#gi').value.trim()||'👥',ids});if(r.error)return toast('Gagal bikin grup');o.remove();await loadAll();openChat(r.data)};
}
function profileForm(first){
  if($('#prof'))return;const p=P[me.id]||{},md=me.user_metadata||{};let vid=false,ava=null,url=p.avatar_url||md.avatar_url||'';
  const o=document.createElement('div');o.className='ov';o.id='prof';o.style.zIndex=30;
  o.innerHTML=`<div class="hd">${first?'':'<button class="btn" id="x">Batal</button>'}<div class="t1" style="justify-content:center">${first?'Selamat datang di Association':'Edit profil'}</div></div><div class="form"><div style="text-align:center"><div id="pv" style="display:flex;justify-content:center"></div><button class="btn" id="pp">Ganti foto profil</button></div><input class="f" id="pn" placeholder="Nama" maxlength="30" value="${esc(p.name||md.full_name||md.name||'')}"><input class="f" id="pu" placeholder="username (a-z 0-9 _ .)" maxlength="20" value="${esc(p.username||'')}"><input class="f" id="pb" placeholder="Bio" maxlength="80" value="${esc(p.bio||'')}"><button class="pill" id="sv">Simpan</button></div>`;
  document.body.appendChild(o);
  const pv=()=>{$('#pv').innerHTML=url?((vid||(!ava&&isVid(url)))?`<video class="av" style="width:96px;height:96px" src="${esc(ava?URL.createObjectURL(ava):url)}" autoplay loop muted playsinline></video>`:`<img class="av" style="width:96px;height:96px" src="${esc(ava?URL.createObjectURL(ava):url)}">`):`<div class="av" style="width:96px;height:96px;font-size:40px">${esc(($('#pn').value||'?')[0]).toUpperCase()}</div>`};pv();
  if($('#x'))$('#x').onclick=()=>o.remove();
  $('#pp').onclick=async()=>{const f=await pick(isOwner?'image/*,video/*':'image/*');if(!f)return;try{vid=f.type.startsWith('video/');if(vid&&f.size>8e6)return toast('Video PP maksimal 8 MB');ava=vid?f:await rz(f,256,.85);url='x';pv()}catch(e){toast('Foto gagal')}};
  $('#sv').onclick=async()=>{const n=$('#pn').value.trim(),u=$('#pu').value.trim().toLowerCase();
    if(!n)return toast('Nama wajib diisi');if(!/^[a-z0-9_.]{3,20}$/.test(u))return toast('Username 3-20 karakter: a-z 0-9 _ .');
    if(Object.values(P).some(x=>x.id!==me.id&&x.username.toLowerCase()===u))return toast('Username sudah dipakai orang lain');
    try{if(ava)url=await upload(ava,'avatars',vid?(ava.name.split('.').pop()||'mp4').toLowerCase():'jpg')}catch(e){toast('Foto gagal diunggah')}
    const r=await sb.from('profiles').upsert({id:me.id,name:n,username:u,bio:$('#pb').value.trim(),avatar_url:url==='x'?null:url||null});
    if(r.error)return toast(r.error.code==='23505'?'Username sudah dipakai orang lain':/reserved/.test(r.error.message)?'Username itu dicadangkan':'Gagal simpan');
    o.remove();await loadAll();render();saveAcct();welcome();toast('Tersimpan')};
}

/* ---------- status ---------- */
const SBG=['#00a884','#0a84ff','#ff2d55','#af52de','#ff9500','#1c1c1e'];
function statusTab(m){
  const by={};S.forEach(s=>(by[s.user_id]=by[s.user_id]||[]).push(s));const ids=Object.keys(by).filter(i=>i!==me.id);
  m.innerHTML=`<div class="lt">Pembaruan</div><div class="sec">Status</div><div class="item" id="ms">${by[me.id]?`<div class="ring">${av(me.id,48)}</div>`:av(me.id,52)}<div class="b"><div class="t1">Status saya ${vb(me.id)?ck:''}</div><div class="t2">${by[me.id]?by[me.id].length+' status aktif':'Ketuk ＋ buat posting'}</div></div><button class="btn" id="ad">＋</button></div>`+(ids.length?ids.map(i=>`<div class="item" data-u="${i}"><div class="ring">${av(i,48)}</div><div class="b"><div class="t1">${nm(i)}</div><div class="t2">${hhmm(by[i][0].created_at)}</div></div></div>`).join(''):'<div class="emp">Belum ada status dari orang lain</div>');
  $('#ad').onclick=e=>{e.stopPropagation();sheet([['Status teks',textStatus],['Status foto',async()=>{const f=await pick('image/*');if(!f)return;try{const u=await upload(await rz(f,1080,.8),'status','jpg');await sb.from('statuses').insert({media_url:u})}catch(e){toast('Gagal')}}]])};
  $('#ms').onclick=()=>by[me.id]&&viewStatus(by[me.id]);
  m.querySelectorAll('[data-u]').forEach(e=>e.onclick=()=>viewStatus(by[e.dataset.u]));
}
function textStatus(){
  const o=document.createElement('div');o.className='ov stv';let bg=SBG[0];o.style.background=bg;o.style.zIndex=30;
  o.innerHTML=`<textarea id="st" placeholder="Ketik status..." style="width:100%;height:50%;background:none;border:0;color:#fff;font-size:28px;text-align:center;outline:0;resize:none"></textarea><div class="sw" style="justify-content:center">${SBG.map(c=>`<i data-c="${c}" style="background:${c};width:34px;height:34px;border-radius:50%;display:block"></i>`).join('')}</div><div style="margin-top:20px"><button class="pill" id="x" style="background:#555">Batal</button> <button class="pill" id="ok">Posting</button></div>`;
  document.body.appendChild(o);o.querySelectorAll('[data-c]').forEach(i=>i.onclick=()=>{bg=i.dataset.c;o.style.background=bg});
  $('#x').onclick=()=>o.remove();
  $('#ok').onclick=async()=>{const t=$('#st').value.trim();if(!t)return;const r=await sb.from('statuses').insert({body:t,bg});if(r.error)toast('Gagal');else o.remove()};
}
function viewStatus(L){
  L=[...L].sort((a,b)=>tm(a.created_at)-tm(b.created_at));let i=0;const o=document.createElement('div');o.className='ov stv';o.style.zIndex=30;document.body.appendChild(o);
  const show=()=>{const s=L[i];o.style.background=s.media_url?'#000':s.bg;o.innerHTML=`<div style="position:absolute;top:12px;left:12px;font-size:16px;display:flex;gap:8px;align-items:center">${av(s.user_id,32)}<span class="t1" style="color:#fff">${nm(s.user_id)}</span><span style="opacity:.7">${hhmm(s.created_at)}</span></div>${s.user_id===me.id||isOwner?'<button class="btn red" id="dl" style="position:absolute;top:8px;right:12px">Hapus</button>':''}${s.media_url?`<img src="${esc(s.media_url)}" style="max-width:100%;max-height:80%;border-radius:12px">`:esc(s.body)}`;
    const d=$('#dl');if(d)d.onclick=ev=>{ev.stopPropagation();sb.from('statuses').delete().eq('id',s.id).then(()=>reload());o.remove()}};
  o.onclick=()=>{if(++i>=L.length)o.remove();else show()};show();
}

/* ---------- settings ---------- */
function setTab(m){
  m.innerHTML=`<div class="lt">Pengaturan</div><div class="item" onclick="profileForm()">${av(me.id,60)}<div class="b" style="border:0"><div class="t1">${nm(me.id)}</div><div class="t2">@${esc(P[me.id].username)} · ketuk buat edit</div></div></div>
  <div class="sec">Tema</div><div class="card sw">${[['auto','Auto'],['light','Terang'],['dark','Gelap']].map(t=>`<button class="chip ${pref.theme===t[0]?'on':''}" onclick="pref.theme='${t[0]}';applyTheme();render()">${t[1]}</button>`).join('')}</div>
  ${P[me.id].verified?`<div class="sec">Centang biru</div><div class="card" style="display:flex;justify-content:space-between;align-items:center"><span>Tampilkan ke orang lain</span><input type="checkbox" ${P[me.id].show_badge!==false?'checked':''} onchange="setBadge(this.checked)"></div>`:''}<div class="sec">Wallpaper chat</div><div class="card sw">${WP.map((w,i)=>`<b class="${pref.wp===i?'on':''}" style="background:${w[1]}" onclick="pref.wp=${i};applyTheme();render()"></b>`).join('')}</div>
  <div class="card t2">${isOwner?'Lu owner: bisa kasih/cabut centang biru di tab Orang.':'Centang biru cuma bisa diatur owner.'}</div>
  <div class="grp"><div class="item" onclick="sb.auth.signOut()"><div class="b red" style="border:0">Keluar</div></div></div>`;
}

/* ---------- calls (WebRTC, signaling lewat Supabase Realtime) ---------- */
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
async function sg(to,d){let ch=chs[to];if(!ch){ch=chs[to]=sb.channel('call-'+to);await new Promise(r=>ch.subscribe(s=>{if(s==='SUBSCRIBED')r()}))}ch.send({type:'broadcast',event:'sig',payload:{from:me.id,to,...d}})}
const cst=t=>{const e=$('#cs');if(e)e.textContent=t};
function callUI(txt,inc){
  let o=$('#call');if(!o){o=document.createElement('div');o.id='call';o.className='ov stv';o.style.cssText='z-index:60;background:#111;font-size:20px';document.body.appendChild(o)}
  o.innerHTML=`<video id="rv" autoplay playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;${vv?'':'display:none'}"></video><video id="lv" autoplay playsinline muted style="position:absolute;right:12px;top:12px;width:90px;border-radius:12px;${vv?'':'display:none'}"></video><div style="position:relative;z-index:1"><div style="display:flex;justify-content:center">${av(callTo,110)}</div><div style="margin:10px 0" class="t1" style="justify-content:center">${nm(callTo)}</div><div id="cs" style="font-size:16px;opacity:.8">${txt}</div><div style="margin-top:30px">${inc?'<button class="pill" style="background:#25d366" onclick="answer()">Terima</button> ':''}<button class="pill" style="background:#ff3b30" onclick="hang(1)">${inc?'Tolak':'Akhiri'}</button></div></div>`;
  if(mstream&&vv)$('#lv').srcObject=mstream;if(rstream)$('#rv').srcObject=rstream;
}
async function mk(){
  mstream=await navigator.mediaDevices.getUserMedia({audio:true,video:!!vv});
  pc=new RTCPeerConnection(ICE);rstream=null;mstream.getTracks().forEach(t=>pc.addTrack(t,mstream));
  pc.ontrack=e=>{rstream=e.streams[0];const v=$('#rv');if(v)v.srcObject=rstream;connT=connT||Date.now();cst('Tersambung')};
  pc.onicecandidate=e=>e.candidate&&sg(callTo,{k:'ice',c:e.candidate});
  pc.onconnectionstatechange=()=>{if(pc&&['failed','closed'].includes(pc.connectionState)){toast('Koneksi putus');hang(0)}};
}
async function call(v){
  if(C[cur].is_group)return toast('Panggilan grup belum ada');
  if(!navigator.mediaDevices||pc)return toast('Panggilan tidak didukung di sini');
  callTo=otherOf(cur);callChat=cur;vv=!!v;isCaller=true;connT=0;
  try{callUI('Memanggil...',0);await mk();callUI('Memanggil...',0);const o=await pc.createOffer();await pc.setLocalDescription(o);sg(callTo,{k:'offer',sdp:o,vid:vv})}catch(e){toast('Mic/kamera ditolak atau tidak tersedia');hang(0)}
}
async function sig(d){
  if(!d||d.to!==me.id)return;
  if(d.k==='offer'){if(pc||pend){sg(d.from,{k:'end'});return}callTo=d.from;pend=d;vv=!!d.vid;qIce=[];isCaller=false;callUI(d.vid?'Video call masuk':'Panggilan suara masuk',1)}
  else if(d.k==='answer'&&pc){await pc.setRemoteDescription(d.sdp);flush()}
  else if(d.k==='ice'){pc&&pc.remoteDescription?pc.addIceCandidate(d.c).catch(()=>{}):qIce.push(d.c)}
  else if(d.k==='end'&&d.from===callTo)hang(0,1);
}
const flush=()=>qIce.splice(0).forEach(c=>pc.addIceCandidate(c).catch(()=>{}));
async function answer(){
  try{const o=pend;await mk();callUI('Menyambung...',0);await pc.setRemoteDescription(o.sdp);flush();const a=await pc.createAnswer();await pc.setLocalDescription(a);sg(callTo,{k:'answer',sdp:a})}catch(e){toast('Mic/kamera ditolak');hang(1)}
}
function hang(n,q){
  if(n&&callTo)sg(callTo,{k:'end'});
  if(isCaller&&callChat){const s=connT?Math.round((Date.now()-connT)/1000):0;sb.from('messages').insert({chat_id:callChat,type:'call',body:(vv?'Video call':'Panggilan suara')+' · '+(s?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):'Tidak terjawab')}).select().single().then(r=>r.data&&addMsg(r.data))}
  isCaller=false;const p=pc;pc=null;if(p)p.close();if(mstream)mstream.getTracks().forEach(t=>t.stop());
  mstream=rstream=pend=null;connT=0;qIce=[];const o=$('#call');if(o){o.remove();if(q)toast('Panggilan selesai')}
}
function setBadge(v){sb.from('profiles').update({show_badge:v}).eq('id',me.id).then(r=>{if(r.error)toast('Gagal ubah');else{P[me.id].show_badge=v;render();toast(v?'Centang biru ditampilkan':'Centang biru disembunyikan')}})}
applyTheme();
</script>
