<title>Vloidchat</title>
<style>
:root{--bg:#fff;--gb:#f2f2f7;--cd:#fff;--tx:#000;--tx2:#8a8a8e;--line:#d1d1d6;--acc:#007aff;--grn:#25d366;--in:#fff;--out:#dcf8c6;--bar:rgba(249,249,249,.94);--wpd:#ece5dd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--gb:#000;--cd:#1c1c1e;--tx:#fff;--tx2:#8d8d93;--line:#38383a;--in:#262d31;--out:#056162;--bar:rgba(29,29,29,.94);--wpd:#0d1418;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--gb:#000;--cd:#1c1c1e;--tx:#fff;--tx2:#8d8d93;--line:#38383a;--in:#262d31;--out:#056162;--bar:rgba(29,29,29,.94);--wpd:#0d1418;color-scheme:dark}
html,body{height:100%;margin:0}
body{position:relative;font:17px -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;background:var(--bg);color:var(--tx);overflow:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font-family:inherit}
#app{height:100%;display:flex;flex-direction:column}
#main{flex:1;overflow:auto}
.top{display:flex;justify-content:space-between;align-items:center;padding:4px 10px 0}
.lt{font-size:34px;font-weight:700;margin:2px 16px 8px;letter-spacing:-.3px}
.btn{background:none;border:0;color:var(--acc);font-size:17px;cursor:pointer;padding:8px 6px}
.pill{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-size:16px;font-weight:600;cursor:pointer}
.srch2{margin:0 16px 8px;background:var(--gb);border-radius:10px;padding:0 10px;display:flex;align-items:center;gap:6px;height:36px}
.srch2 input{flex:1;background:none;border:0;color:var(--tx);font:inherit;font-size:17px;outline:0}
:root[data-theme="dark"] .srch2,:root:not([data-theme="light"]) .srch2{background:#1c1c1e}
.chips{display:flex;gap:8px;padding:0 16px 6px;overflow:auto}
.chip{background:var(--gb);border:0;border-radius:16px;padding:6px 14px;color:var(--tx2);font-size:14px;white-space:nowrap}
.chip.on{background:rgba(37,211,102,.2);color:#0a9a45;font-weight:600}
.lnk{color:var(--acc);padding:8px 16px 10px;font-size:17px;cursor:pointer;border-bottom:.5px solid var(--line)}
.item{display:flex;gap:12px;align-items:center;padding:0 0 0 16px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.item:active{background:var(--gb)}
.item .b{flex:1;min-width:0;border-bottom:.5px solid var(--line);padding:9px 16px 9px 0;display:flex;align-items:center;gap:8px}
.item .bm{flex:1;min-width:0}
.t1{font-weight:600;display:flex;align-items:center;gap:4px}
.t2{color:var(--tx2);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{color:var(--tx2);font-size:13px;white-space:nowrap}
.bdg{background:var(--grn);color:#fff;border-radius:11px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;padding:0 6px}
.av{border-radius:50%;object-fit:cover;background:#8e8e93;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.ck{width:16px;height:16px;flex:none}
#tabs{display:flex;border-top:.5px solid var(--line);background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);padding-top:6px}
#tabs button{flex:1;background:none;border:0;padding:0 0 4px;color:var(--tx2);cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
#tabs button small{font-size:10px}
#tabs button.on{color:var(--acc)}
#tabs em{position:absolute;top:-3px;left:calc(50% + 6px);background:#ff3b30;color:#fff;font-style:normal;font-size:12px;min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.ov{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:5}
.hd{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bar);border-bottom:.5px solid var(--line);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);min-height:48px}
.hm{flex:1;min-width:0;cursor:pointer}
.hm .t1{font-size:17px}
.hm .t2{font-size:12px}
.hc{flex:1;text-align:center;font-weight:600}
.back{background:none;border:0;color:var(--acc);display:flex;align-items:center;font-size:17px;padding:4px 0;cursor:pointer;min-width:70px}
.ic{background:none;border:0;cursor:pointer;padding:4px 5px;display:flex;align-items:center}
#msgs{flex:1;overflow:auto;padding:8px 10px;display:flex;flex-direction:column;background:var(--wpd)}
.row{display:flex;flex-direction:column;align-items:flex-start;max-width:80%;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;margin-top:2px}
.row.first{margin-top:8px}
.row.me{align-self:flex-end;align-items:flex-end}
.bub{background:var(--in);color:var(--tx);padding:6px 9px 5px;border-radius:9px;word-break:break-word;white-space:pre-wrap;box-shadow:0 1px .5px rgba(0,0,0,.13);position:relative;font-size:16.5px;line-height:1.28}
.me .bub{background:var(--out)}
.bub.t::before{content:"";position:absolute;top:0;width:9px;height:12px;background:inherit}
.row:not(.me) .bub.t{border-top-left-radius:0}.row:not(.me) .bub.t::before{left:-8px;clip-path:polygon(100% 0,100% 100%,0 0)}
.me .bub.t{border-top-right-radius:0}.me .bub.t::before{right:-8px;clip-path:polygon(0 0,100% 0,0 100%)}
.tt{float:right;margin:7px 0 -3px 10px;font-size:11px;color:var(--tx2);white-space:nowrap;line-height:1}
.bub.im{padding:3px}
.bub.im img,.bub.im video{max-width:100%;max-height:320px;border-radius:7px;display:block}
.bub.im .tt{position:absolute;right:9px;bottom:7px;margin:0;color:#fff;text-shadow:0 0 4px rgba(0,0,0,.7)}
.q{border-left:4px solid var(--grn);background:rgba(0,0,0,.06);border-radius:5px;padding:3px 8px;margin-bottom:4px;font-size:13.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.stk{font-size:88px;line-height:1.1}
.big{font-size:44px;line-height:1.1}
.sys{align-self:center;background:var(--in);color:var(--tx2);font-size:12.5px;border-radius:8px;padding:4px 10px;margin:8px 0;box-shadow:0 1px .5px rgba(0,0,0,.1)}
.who{font-size:13px;font-weight:600;color:#06a07c;display:flex;gap:4px;align-items:center;margin-bottom:1px}
.rx{font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:1px 6px;margin-top:-4px;z-index:1}
.comp{display:flex;gap:4px;align-items:flex-end;padding:6px 6px 8px;background:var(--bar);border-top:.5px solid var(--line)}
.tf{flex:1;display:flex;align-items:flex-end;background:var(--bg);border:.5px solid var(--line);border-radius:19px;padding:0 6px 0 12px;min-height:36px}
.tf textarea{flex:1;border:0;background:none;color:var(--tx);font:inherit;font-size:17px;resize:none;max-height:110px;outline:0;padding:7px 0}
.snd{width:34px;height:34px;border-radius:50%;background:var(--grn);border:0;display:flex;flex:none;align-items:center;justify-content:center;cursor:pointer;margin-bottom:1px;opacity:.45;transition:opacity .15s}.snd.on{opacity:1}.tf{min-width:0}.tf textarea{min-width:0;width:100%}
#pan{height:230px;overflow:auto;background:var(--gb);padding:8px;display:none}
#pan .g{display:grid;grid-template-columns:repeat(8,1fr);font-size:28px;text-align:center}
#pan .g.s{grid-template-columns:repeat(4,1fr);font-size:58px}
#pan .g span{cursor:pointer;padding:4px}
.pt{display:flex;gap:8px;margin-bottom:6px}
.pt button{border:0;background:var(--bg);color:var(--tx);border-radius:14px;padding:4px 12px}
.sheet{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;flex-direction:column;justify-content:flex-end;padding:12px}
.sheet .c{background:var(--cd);border-radius:14px;overflow:hidden;margin-bottom:8px;color:var(--tx)}
.sheet .c>div{padding:15px 16px;border-bottom:.5px solid var(--line);cursor:pointer;text-align:center;color:var(--acc)}
.sheet .c>div:last-child{border:0}
.sheet .c>div.red{color:#ff3b30}
.sheet .rr{display:flex;justify-content:space-around;font-size:30px;padding:10px}
.red{color:#ff3b30}
.form{padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
input.f{border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:10px;padding:11px;font:inherit;width:100%;outline:0}
.gb{flex:1;overflow:auto;background:var(--gb);padding-bottom:30px}
.gp{background:var(--gb)}
.grp{background:var(--cd);border-radius:10px;margin:14px 16px 0;overflow:hidden}
.sec{padding:18px 32px 0;color:var(--tx2);font-size:13px;text-transform:uppercase}
.foot{padding:6px 32px 0;color:var(--tx2);font-size:13px}
.srow{display:flex;align-items:center;gap:14px;padding-left:16px;background:var(--cd);cursor:pointer}
.srow:active{filter:brightness(.95)}
.si{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none}
.sx{flex:1;display:flex;align-items:center;justify-content:space-between;min-height:46px;padding-right:16px;border-bottom:.5px solid var(--line);gap:8px}
.srow:last-child .sx{border:0}
.sr{color:var(--tx2);display:flex;align-items:center;gap:4px}
.tg{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:16px;background:var(--line);position:relative;transition:.2s;flex:none;border:0;outline:0;cursor:pointer}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:.2s}
.tg:checked{background:#34c759}.tg:checked::after{left:22px}
.pf{display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--cd);margin-top:14px;cursor:pointer}
.sw{display:flex;gap:10px;flex-wrap:wrap;padding:14px 16px;background:var(--cd)}
.sw b{width:56px;height:80px;border-radius:10px;display:block;cursor:pointer;border:3px solid transparent}
.sw b.on{border-color:var(--acc)}
.card{background:var(--cd);border-radius:10px;margin:14px 16px 0;padding:12px 16px}
#toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:#333;color:#fff;padding:8px 14px;border-radius:14px;z-index:99;font-size:14px;display:none;max-width:90%;text-align:center}
.stv{align-items:center;justify-content:center;text-align:center;font-size:28px;padding:24px;color:#fff}
.ring{padding:2px;border-radius:50%;background:linear-gradient(135deg,#25d366,#00a884)}
.ring .av{border:2px solid var(--bg)}
.emp{text-align:center;color:var(--tx2);padding:40px 20px}
.notes{display:flex;gap:14px;overflow-x:auto;padding:40px 16px 8px}
.nt{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;cursor:pointer;flex:none;width:76px}
.nt small{font-size:12px;color:var(--tx2);max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb{position:absolute;top:-34px;left:50%;transform:translateX(-30%);background:var(--cd);color:var(--tx);border-radius:14px;padding:5px 9px;font-size:12px;max-width:100px;box-shadow:0 1px 4px rgba(0,0,0,.25);z-index:1;line-height:1.2;word-break:break-word;border:.5px solid var(--line)}
.nb.add{color:var(--tx2)}
.nbig{display:flex;align-items:flex-end;gap:10px;justify-content:center;margin:14px 0}
.nbub{background:#e11d48;color:#fff;border-radius:22px;padding:14px 18px;font-size:19px;text-align:left;max-width:240px;word-break:break-word}
.rp{display:flex;gap:8px;align-items:center;margin-top:12px}
.rp input{flex:1;border:0;background:var(--gb);color:var(--tx);border-radius:20px;padding:10px 14px;font:inherit;outline:0}
.rp span{font-size:26px;cursor:pointer}
.eye{position:absolute;left:0;right:0;bottom:0;padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:6px;font-size:15px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));cursor:pointer}
#splash{position:absolute;inset:0;z-index:100;background:#05070b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s}
.logo{width:92px;height:92px;border-radius:50%;background:#000;overflow:hidden;box-shadow:0 0 0 2px rgba(225,29,72,.7);animation:pop .8s cubic-bezier(.2,1.4,.4,1) both;position:relative}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.logo::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(225,29,72,.55);animation:ring 1.8s ease-out infinite}
.wm{color:#fff;font-size:15px;letter-spacing:.42em;font-weight:600;animation:rise .7s .35s both}
@keyframes pop{from{transform:scale(.3) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@keyframes ring{from{transform:scale(.9);opacity:.9}to{transform:scale(1.5);opacity:0}}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.lx{background:#05070b;color:#fff;justify-content:flex-end;overflow:hidden;z-index:50}
.lx-art{position:absolute;top:0;left:0;width:100%;height:70%;object-fit:cover;object-position:50% 35%;animation:fade 1.4s both}
.lx-fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,11,.25) 0%,rgba(5,7,11,0) 28%,#05070b 64%)}
.lx-c{position:relative;padding:0 24px 28px;display:flex;flex-direction:column;gap:10px;animation:rise .7s .2s both}
.lx-brand{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.42em;font-weight:600;opacity:.9}
.lx-brand img{width:28px;height:28px;border-radius:50%;object-fit:cover}
.lx-t{font-size:34px;font-weight:700;line-height:1.1;margin:6px 0 14px;letter-spacing:-.5px}
.lx-b{display:flex;align-items:center;gap:12px;background:transparent;border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:12px;padding:14px 16px;font:inherit;font-size:16px;font-weight:500;cursor:pointer}
.lx-b:active{background:rgba(255,255,255,.08)}
.lx-b svg{width:20px;height:20px;flex:none}
.lx-s{display:flex;align-items:center;gap:12px;background:#c8102e;border:0;color:#fff;border-radius:12px;padding:12px 14px;font:inherit;font-size:16px;text-align:left;cursor:pointer}
.lx-s .sa{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:700;flex:none}
.lx-s .sa img{width:100%;height:100%;object-fit:cover}
.lx-s>span:nth-child(2){flex:1;min-width:0}
.lx-s small{display:block;opacity:.8}
.lx-s i{font-style:normal;opacity:.75;padding:6px}
.lx-f{font-size:12px;color:rgba(255,255,255,.45);margin-top:4px}
.intro{position:absolute;inset:0;z-index:90;background:#05070b;transition:opacity .6s;animation:fade .4s both}
.intro video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.iv-sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 30%,transparent 50%,rgba(0,0,0,.85))}
.iv-skip,.iv-snd{position:absolute;top:12px;border:0;background:rgba(0,0,0,.45);color:#fff;border-radius:16px;padding:6px 14px;font-size:14px}
.iv-skip{right:12px}.iv-snd{left:12px}
.iv-hint{position:absolute;top:56px;left:50%;transform:translateX(-50%);background:rgba(225,29,72,.92);color:#fff;border-radius:18px;padding:8px 16px;font-size:14px;display:none;animation:rise .4s both;white-space:nowrap}
.iv-b{position:absolute;left:0;right:0;bottom:0;padding:20px 20px 28px;color:#fff;display:flex;flex-direction:column;gap:14px}
.iv-n{display:flex;gap:12px;align-items:center}
.iv-p{height:4px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden}
.iv-p i{display:block;height:100%;width:0;background:#e11d48;border-radius:2px;transition:width .2s linear}
.iv-t{display:flex;justify-content:space-between;font-size:12.5px;color:rgba(255,255,255,.75);font-variant-numeric:tabular-nums}
.np{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#075e54;color:#fff}
.np:empty{display:none}
.npt{flex:1;min-width:0}.npt b,.npt small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npt small{opacity:.8;font-size:12px}

textarea.f{border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:10px;padding:11px;font:inherit;width:100%;outline:0}
.rb{width:36px;height:36px;border-radius:50%;background:var(--gb);border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tx)}
.rb.g{background:#25d366}
#fab{position:absolute;right:16px;bottom:78px;z-index:3;display:flex;flex-direction:column;align-items:center;gap:12px}
.fb{width:48px;height:48px;border-radius:50%;background:var(--cd);border:0;box-shadow:0 2px 10px rgba(0,0,0,.25);padding:0;overflow:hidden;cursor:pointer}

.fg{width:60px;height:60px;border-radius:18px;background:#1fa855;border:0;box-shadow:0 4px 14px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;cursor:pointer}
.pinb{display:flex;gap:8px;padding:8px 14px;background:var(--bar);border-bottom:.5px solid var(--line);font-size:14px;cursor:pointer;align-items:center}
.pinb span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cm{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:center;padding:16px}
.cmw{display:flex;flex-direction:column;gap:10px;width:100%;max-height:100%;overflow:auto;padding:4px 0}
.rxb{display:flex;align-items:center;gap:8px;background:var(--cd);border-radius:32px;padding:8px 14px;font-size:30px;max-width:100%;overflow-x:auto}

.cmb{pointer-events:none;align-self:stretch;display:flex;flex-direction:column}

.cml{background:var(--cd);border-radius:14px;width:240px;overflow:hidden}

.cml>div:last-child{border:0}
.cml .red{color:#ff3b30}
.cb{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(255,255,255,.18);flex:none}
.cb.sm{width:58px;height:58px}
.cb.on{background:#fff}.cb.on svg{stroke:#000}
.rg{padding:3px;border-radius:50%;display:inline-flex;flex:none}
.rg .av{border:2.5px solid var(--bg)}
.seg{position:absolute;top:8px;left:10px;right:10px;display:flex;gap:4px;z-index:2}
.seg i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}
.seg i.on{background:#fff}
.bcard img{width:100%;max-height:200px;object-fit:cover;border-radius:8px;display:block;margin:2px 0 6px}
.bbar{display:flex;gap:6px;overflow-x:auto;padding:6px 8px;background:var(--bar);border-top:.5px solid var(--line)}
.bbar:empty{display:none}
.bbar .chip{flex:none}
html,body{overflow-x:hidden}
.t1{min-width:0}.hm .t1{overflow:hidden;white-space:nowrap}
.sheet .c{max-height:88vh;overflow:auto}
.row{min-width:0}.bub{max-width:100%}.bub iframe,.bub img,.bub audio{max-width:100%}
#msgs{overflow-x:hidden}
.notes{padding:10px 16px 8px;gap:12px}

.nbig{flex-wrap:wrap}.nbub{max-width:min(240px,70vw)}
#ytv{position:absolute;left:0;right:0;top:0;z-index:65;display:none;background:#000;color:#fff}
#ytw{position:relative;padding-top:56.25%;background:#000}

.ytc{display:flex;gap:8px;align-items:center;padding:8px 12px;background:#111}
.ytc button{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:14px;padding:6px 11px;font-size:16px;cursor:pointer}
#yttap{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:2}
#yttap button{background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:24px;padding:12px 22px;font-size:17px}
.bcl{flex:1;overflow:auto;margin:14px 0;display:flex;flex-direction:column;gap:6px}

function stopLocal(){ytClose();A.pause();A.removeAttribute('src');try{A.load()}catch(e){}delete A.dataset.u;AR=null;renderNP()}
function applyRoom(id,st){
  const r=rooms[id];if(!r)return;r.st=st;
  if(r.off||(AR&&AR!==id)){renderNP();return}
  if(!st.now){if(AR===id)stopLocal();renderNP();return}
  AR=id;r.tap=false;if(st.now.yt){try{A.pause()}catch(e){}ytLoad(st);renderNP();return}else ytClose();
  if(A.dataset.u!==st.now.url){A.src=st.now.url;A.dataset.u=st.now.url}
  const seek=()=>{try{if(Math.abs(A.currentTime-st.pos)>1.5)A.currentTime=st.pos}catch(e){}};
  A.readyState>0?seek():A.addEventListener('loadedmetadata',seek,{once:true});
  if(st.playing){const pl=A.play();if(pl&&pl.catch)pl.catch(()=>{r.tap=true;renderNP()})}else A.pause();
  renderNP();
}
A.onended=()=>{const r=AR&&rooms[AR];if(!r||!r.st||!r.st.now)return;const s=r.st,nx=s.q[0];applyRoom(AR,nx?{now:nx,q:s.q.slice(1),playing:true,pos:0}:{now:null,q:[],playing:false,pos:0})};
function joinRoom(id){
  if(rooms[id])return;const r=rooms[id]={st:null,off:false,tap:false};
  r.ch=sb.channel('room-'+id).on('broadcast',{event:'r'},({payload})=>onRoom(id,payload)).subscribe(s=>{if(s==='SUBSCRIBED')r.ch.send({type:'broadcast',event:'r',payload:{k:'ask',from:me.id}})});
}
function onRoom(id,p){
  const r=rooms[id];if(!r||!p)return;
  if(p.k==='ask'){if(p.from!==me.id&&AR===id&&r.st&&r.st.now)setTimeout(()=>r.ch.send({type:'broadcast',event:'r',payload:{k:'state',st:{...r.st,pos:(r.st.now.yt?ytTime():A.currentTime),playing:(r.st.now.yt?ytPlaying():!A.paused)}}}),Math.random()*600)}
  else if(p.k==='state')applyRoom(id,p.st);
}
function roomSend(id,st){const r=rooms[id];if(!r)return;r.off=false;r.ch.send({type:'broadcast',event:'r',payload:{k:'state',st}});applyRoom(id,st)}
function rctl(id,act,viaCmd){
  const r=rooms[id],st=r&&r.st,say=b=>{if(viaCmd&&cur===id)send({type:'bot',body:b})};

  const pos=AR===id?(st.now.yt?ytTime():A.currentTime):st.pos;
  if(act==='pause')roomSend(id,{...st,playing:false,pos});
  else if(act==='resume')roomSend(id,{...st,playing:true,pos});
  else if(act==='skip')st.q.length?roomSend(id,{now:st.q[0],q:st.q.slice(1),playing:true,pos:0}):roomSend(id,{now:null,q:[],playing:false,pos:0});
  else if(act==='stop')roomSend(id,{now:null,q:[],playing:false,pos:0});
  say({pause:'⏸ Dijeda',resume:'▶ Dilanjutkan',skip:'⏭ Lagu dilewati',stop:'⏹ Dihentikan'}[act]);
}
function leaveRoom(id){const r=rooms[id];if(!r)return;r.off=true;if(AR===id)stopLocal();renderNP()}

/* ---------- NLU bot ---------- */
const norm=t=>String(t||'').toLowerCase().replace(/[^\p{L}\p{N}\s@:/._-]/gu,' ').replace(/\s+/g,' ').trim();
const lev=(a,b)=>{const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]};
const sim=(a,b)=>1-lev(a,b)/Math.max(a.length,b.length,1);
function bestSong(q){q=norm(q);const qt=q.split(' ').filter(Boolean);let best=null;for(const sg of SG){const name=norm(songName(sg)),nt=name.split(' ').filter(Boolean);let sc=name.includes(q)?1:0;if(sc<1&&qt.length){let tot=0;for(const w of qt)tot+=Math.max(0,...nt.map(z=>w===z?1:sim(w,z)));sc=tot/qt.length*.9}if(!best||sc>best.score)best={s:sg,score:sc}}return best}
function nlu(raw){
  const link=(String(raw).match(/https?:\/\/\S+/)||[''])[0];
  if(ytId(raw))return{c:'nonton',a:link};
  if(sp(raw))return{c:'spotify',a:link};
  let t=norm(raw).replace(/^((hai|halo|hey|bot|vloid|tolong|coba|dong|please|bang|kak)\s+)+/,''),m;
  if(m=t.match(/^(putar|putarkan|play|setel|setelin|dengerin|dengarkan|mainkan|nyalain)\s+(lagu\s+|musik\s+)?(.+)$/))return{c:'play',a:m[3]};
  if(/^(jeda|pause|berhenti sebentar|stop dulu)$/.test(t))return{c:'pause'};
  if(/^(lanjut|lanjutkan|resume|terusin)$/.test(t))return{c:'resume'};
  if(/^(skip|next|lewati|ganti lagu|lagu berikutnya)$/.test(t))return{c:'skip'};
  if(/^(stop|berhenti|matikan( musik| lagu| video)?|udahan)$/.test(t))return{c:'stop'};
  if(/(daftar|list|apa aja|ada lagu apa)/.test(t)&&/lagu|musik/.test(t))return{c:'lagu'};
  if(/antrean|antrian|queue/.test(t))return{c:'antrean'};
  if(m=t.match(/^(nonton|tonton|stream|youtube|yt)\s+(.+)$/))return{c:'nonton',a:m[2]};
  if(/(buka|mau|pengen) (dengerin |dengar |pemutar )?(musik|lagu)/.test(t))return{c:'musik'};
  if(/(telpon|telepon|call|hubungi) (aku|saya|gue|gw)/.test(t))return{c:'telepon'};
  if(/(jam berapa|pukul berapa|waktu sekarang|hari apa|tanggal berapa|tanggal)/.test(t))return{c:'waktu'};
  if(m=t.match(/^(hitung|berapa)\s+(.+)$/))return{c:'hitung',a:m[2]};
  if(/(siapa kamu|kamu siapa|siapa namamu|perkenalkan)/.test(t))return{c:'info'};
  if(/(anggota|member)/.test(t))return{c:'anggota'};
  if(/^(menu|help|bantuan|fitur|bisa apa|kamu bisa apa|perintah)/.test(t))return{c:'menu'};
  if(/^(ping|tes|test)$/.test(t))return{c:'ping'};
  if(/(makasih|terima kasih|thanks|thx)/.test(t))return{c:'_thanks'};
  if(/^(halo|hai|hi|hello|p|assalamualaikum|pagi|siang|sore|malam)$/.test(t))return{c:'_hi'};
  const b=SG.length?bestSong(t):null;if(b&&b.score>.75)return{c:'play',a:t};
  const cu=BCMD.find(k=>t.includes(k.name));if(cu)return{c:cu.name};
  return{c:'_unknown',a:t};
}

const TURN=[];const ICE={iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302','stun:stun.cloudflare.com:3478']},...TURN]};

const cst=t=>{const e=$('#cs');if(e)e.textContent=t};
let ringT,callTick,callTO,muted=false;
function ring(on,type){clearInterval(ringT);if(!on)return;const beep=()=>{try{const a=ring.ctx||(ring.ctx=new(window.AudioContext||window.webkitAudioContext)()),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=type==='in'?520:440;g.gain.setValueAtTime(.001,a.currentTime);g.gain.exponentialRampToValueAtTime(.15,a.currentTime+.05);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.7);o.start();o.stop(a.currentTime+.75);if(type==='in'&&navigator.vibrate)navigator.vibrate([300,200,300])}catch(e){}};beep();ringT=setInterval(beep,type==='in'?1800:3000)}
function toggleMute(){muted=!muted;if(mstream)mstream.getAudioTracks().forEach(t=>t.enabled=!muted);const e=$('#cmu');if(e)e.classList.toggle('on',muted)}

function callUI(txt,inc){
  let o=$('#call');if(!o){o=document.createElement('div');o.id='call';o.className='ov';o.style.cssText='z-index:60;background:#000;color:#fff;overflow:hidden';document.body.appendChild(o)}
  const p=P[callTo]||{},bg=p.avatar_url&&!isVid(p.avatar_url)?`url(${p.avatar_url})`:'linear-gradient(160deg,#1f2937,#0b1220)',showV=vv&&rstream;
  o.innerHTML=`<div style="position:absolute;inset:-40px;background:${bg} center/cover;filter:blur(38px) brightness(.55)"></div><video id="rv" autoplay playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;${showV?'':'display:none'}"></video><video id="lv" autoplay playsinline muted style="position:absolute;right:14px;top:60px;width:96px;border-radius:14px;z-index:2;${vv?'':'display:none'}"></video>

  if(mstream&&vv)$('#lv').srcObject=mstream;if(rstream)$('#rv').srcObject=rstream;

async function mk(){
  mstream=await navigator.mediaDevices.getUserMedia({audio:true,video:!!vv});
  pc=new RTCPeerConnection(ICE);rstream=null;mstream.getTracks().forEach(t=>pc.addTrack(t,mstream));

  pc.onicecandidate=e=>e.candidate&&sg(callTo,{k:'ice',c:e.candidate});

}
async function call(v){
  if(isBotChat(cur))return botCall(!!v);if(C[cur].is_group)return toast('Panggilan grup belum ada');
  if(!navigator.mediaDevices||pc)return toast('Panggilan tidak didukung di sini');
  callTo=otherOf(cur);callChat=cur;vv=!!v;isCaller=true;connT=0;
  try{callUI('Memanggil...',0);ring(true,'out');callTO=setTimeout(()=>{toast('Tidak dijawab');hang(1)},45000);await mk();callUI('Memanggil...',0);const o=await pc.createOffer();await pc.setLocalDescription(o);sg(callTo,{k:'offer',sdp:o,vid:vv})}catch(e){toast('Mic/kamera ditolak atau tidak tersedia');hang(0)}
}
async function sig(d){
  if(!d||d.to!==me.id)return;
  if(d.k==='offer'){if(pc||pend){sg(d.from,{k:'end'});return}callTo=d.from;pend=d;vv=!!d.vid;qIce=[];isCaller=false;callUI(d.vid?'Video call masuk':'Panggilan suara masuk',1);ring(true,'in');callTO=setTimeout(()=>hang(1),45000);if(document.hidden&&window.Notification&&Notification.permission==='granted')try{new Notification(((P[d.from]||{}).name||'Seseorang')+' menelepon',{icon:ICON})}catch(e){}}
  else if(d.k==='answer'&&pc){await pc.setRemoteDescription(d.sdp);flush()}
  else if(d.k==='ice'){pc&&pc.remoteDescription?pc.addIceCandidate(d.c).catch(()=>{}):qIce.push(d.c)}

const flush=()=>qIce.splice(0).forEach(c=>pc.addIceCandidate(c).catch(()=>{}));

  try{ring(false);clearTimeout(callTO);const o=pend;await mk();callUI('Menyambung...',0);await pc.setRemoteDescription(o.sdp);flush();const a=await pc.createAnswer();await pc.setLocalDescription(a);sg(callTo,{k:'answer',sdp:a})}catch(e){toast('Mic/kamera ditolak');hang(1)}
}
function hang(n,q){
  if(n&&callTo)sg(callTo,{k:'end'});
  if(isCaller&&callChat){const s=connT?Math.round((Date.now()-connT)/1000):0;sb.from('messages').insert({chat_id:callChat,type:'call',body:(vv?'Video call':'Panggilan suara')+' · '+(s?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):'Tidak terjawab')}).select().single().then(r=>r.data&&addMsg(r.data))}
  ring(false);clearTimeout(callTO);clearInterval(callTick);muted=false;isCaller=false;const p=pc;pc=null;if(p)p.close();if(mstream)mstream.getTracks().forEach(t=>t.stop());
  mstream=rstream=pend=null;connT=0;qIce=[];const o=$('#call');if(o){o.remove();if(q)toast('Panggilan selesai')}
}

/* ---------- kamera (ambil foto langsung) ---------- */
function camShot(){return new Promise(async ok=>{
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){const f=await pick('image/*',true);return ok(f?await rz(f,1280,.85):null)}
  let face='environment',stream=null;const o=document.createElement('div');o.className='ov';o.style.cssText='z-index:80;background:#000;color:#fff';
  o.innerHTML=`<video id="cv" autoplay playsinline muted style="flex:1;width:100%;object-fit:cover;min-height:0"></video><div style="display:flex;justify-content:space-around;align-items:center;padding:20px 20px 30px;background:#000"><button class="btn" id="cx" style="color:#fff">Batal</button><button id="cs2" style="width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.3)"></button><button class="btn" id="cf" style="color:#fff">Putar</button></div>`;
  document.body.appendChild(o);
  const done=b=>{if(stream)stream.getTracks().forEach(t=>t.stop());o.remove();ok(b)};
  const start=async()=>{if(stream)stream.getTracks().forEach(t=>t.stop());try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:face,width:{ideal:1280}},audio:false});const v=o.querySelector('#cv');v.srcObject=stream;v.style.transform=face==='user'?'scaleX(-1)':''}catch(e){toast('Kamera tidak bisa diakses');done(null)}};
  o.querySelector('#cx').onclick=()=>done(null);o.querySelector('#cf').onclick=()=>{face=face==='user'?'environment':'user';start()};
  o.querySelector('#cs2').onclick=()=>{const v=o.querySelector('#cv');if(!v.videoWidth)return;const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;const x=c.getContext('2d');if(face==='user'){x.translate(c.width,0);x.scale(-1,1)}x.drawImage(v,0,0);c.toBlob(b=>done(b),'image/jpeg',.88)};
  start();
})}

/* ---------- YouTube: nonton bareng (pemutar resmi YouTube, disinkronkan) ---------- */
const isEmb=u=>isSpU(u)||String(u||'').startsWith('https://www.youtube.com/embed/');
const embH=u=>isSpU(u)?(/\/(track|episode)\//.test(u)?80:152):180;
function ytId(u){const m=String(u||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:[^#\s]*&)?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);return m?m[1]:null}
async function ytTitle(id){try{const r=await fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent('https://www.youtube.com/watch?v='+id));if(r.ok){const j=await r.json();if(j.title)return j.title}}catch(e){}return 'Video YouTube'}
async function ytSearch(q){try{const r=await fetch('https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=1&q='+encodeURIComponent(q)+'&key='+encodeURIComponent(BC.ytKey));const j=await r.json();const it=j.items&&j.items[0];return it?{id:it.id.videoId,title:it.snippet.title}:null}catch(e){return null}}
let ytP=null,ytReady=false,ytCur=null,ytLast=null;
function ytScript(){return new Promise(ok=>{if(window.YT&&YT.Player)return ok();if(!ytScript.l){ytScript.l=1;const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';document.head.appendChild(sc);window.onYouTubeIframeAPIReady=()=>ok()}else{const t=setInterval(()=>{if(window.YT&&YT.Player){clearInterval(t);ok()}},200)}})}
const ytTime=()=>{try{return ytP&&ytP.getCurrentTime?ytP.getCurrentTime():0}catch(e){return 0}};
const ytPlaying=()=>{try{return !!(ytP&&ytP.getPlayerState&&ytP.getPlayerState()===1)}catch(e){return false}};
function ytBox(){let o=$('#ytv');if(!o){o=document.createElement('div');o.id='ytv';o.innerHTML='<div id="ytw"><div id="ytp"></div><div id="yttap"><button onclick="ytTap()">▶ Ketuk untuk memutar</button></div></div><div class="ytc"><div class="npt"><b id="ytt"></b><small id="ytm"></small></div><span id="ytb"></span></div>';document.body.appendChild(o)}return o}
function ytTap(){try{ytP.playVideo()}catch(e){}$('#yttap').style.display='none'}
function ytCtl(){const id=AR,r=id&&rooms[id],st=r&&r.st,b=$('#ytb');if(!b||!st||!st.now||!st.now.yt)return;b.innerHTML=canCtl(id)?`<button onclick="rctl('${id}','${st.playing?'pause':'resume'}')">${st.playing?'⏸':'▶'}</button><button onclick="rctl('${id}','skip')">⏭</button><button onclick="rctl('${id}','stop')">⏹</button>`:`<button onclick="leaveRoom('${id}')">✕</button>`}
function ytNext(){const r=AR&&rooms[AR];if(!r||!r.st||!r.st.now)return;const st=r.st,nx=st.q[0];applyRoom(AR,nx?{now:nx,q:st.q.slice(1),playing:true,pos:0}:{now:null,q:[],playing:false,pos:0})}
function ytSync(st){if(!ytP||!ytReady)return;try{const t=ytTime();if(Math.abs(t-(st.pos||0))>2)ytP.seekTo(st.pos||0,true);if(st.playing){ytP.playVideo();setTimeout(()=>{if(!ytPlaying()&&ytLast&&ytLast.playing){const e=$('#yttap');if(e)e.style.display='flex'}},1800)}else ytP.pauseVideo()}catch(e){}}
async function ytLoad(st){
  const o=ytBox();o.style.display='block';$('#ytt').textContent=st.now.title||'Video';$('#ytm').textContent='oleh '+((P[st.now.by]||{}).name||'User');ytLast=st;ytCtl();
  await ytScript();const id=st.now.yt;
  if(!ytP){ytP=new YT.Player('ytp',{videoId:id,playerVars:{playsinline:1,rel:0,modestbranding:1,controls:0,disablekb:1},events:{onReady:()=>{ytReady=true;ytSync(ytLast)},onStateChange:e=>{if(e.data===1){const t=$('#yttap');if(t)t.style.display='none'}if(e.data===0)ytNext()}}});ytCur=id}
  else if(ytCur!==id){ytCur=id;ytP.loadVideoById(id,st.pos||0);setTimeout(()=>ytSync(ytLast),600)}
  else ytSync(st);
}
function ytClose(){const o=$('#ytv');if(o)o.style.display='none';try{if(ytP&&ytP.pauseVideo)ytP.pauseVideo()}catch(e){}ytCur=null}
const roomPos=id=>{const st=rooms[id]&&rooms[id].st;return AR===id?(st&&st.now&&st.now.yt?ytTime():A.currentTime):(st?st.pos:0)};
function playItem(it){joinRoom(cur);const st=rooms[cur].st;if(st&&st.now){roomSend(cur,{...st,q:[...st.q,it],pos:roomPos(cur)});return 'q'}roomSend(cur,{now:it,q:[],playing:true,pos:0});return 'p'}

/* ---------- layar musik (dengarkan) ---------- */
function musicScreen(){
  const o=page('Dengarkan Musik',`<div class="form"><input class="f" id="mq" placeholder="Cari lagu..."><div style="display:flex;gap:8px"><button class="pill" id="madd" style="flex:1;background:var(--gb);color:var(--tx)">＋ Tambah lagu</button><button class="pill" id="mlk" style="flex:1">Link YouTube/Spotify</button></div></div><div id="ml"></div><div class="foot">Lagu penuh: upload mp3 milikmu, atau pakai link YouTube (pemutar resmi YouTube). Spotify hanya bisa kartu pemutar dari Spotify.</div>`,'Bot');
  const draw=()=>{const q=norm(o.querySelector('#mq').value||'');const L=SG.filter(z=>!q||norm(songName(z)).includes(q));o.querySelector('#ml').innerHTML=L.length?`<div class="grp">${L.map(z=>`<div class="item" data-i="${SG.indexOf(z)}"><span class="si" style="background:#af52de">${I('music',18,'#fff')}</span><div class="b"><div class="bm"><div class="t1">${esc(z.title)}</div><div class="t2">${esc(z.artist||'Perpustakaan bersama')}</div></div><span style="color:var(--acc)">▶</span></div></div>`).join('')}</div>`:'<div class="emp">Belum ada lagu. Ketuk ＋ Tambah lagu.</div>'};
  draw();o.querySelector('#mq').oninput=draw;
  o.querySelector('#ml').onclick=e=>{const it=e.target.closest('[data-i]');if(!it)return;const z=SG[+it.dataset.i];const r=playItem({url:z.url,title:songName(z),by:me.id});toast(r==='q'?'Masuk antrean':'Memutar: '+songName(z))};
  o.querySelector('#madd').onclick=()=>runBot('/tambah');
  o.querySelector('#mlk').onclick=async()=>{const u=await ask('Link YouTube / Spotify','https://...');if(!u)return;if(ytId(u))runBot('/nonton '+u);else if(sp(u))runBot('/spotify '+u);else toast('Link tidak dikenali')};
}

/* ---------- panggilan dengan bot (suara + perintah) ---------- */
let bcOn=false,bcT=null,bcSec=0,bcRec=null;
const SRec=window.SpeechRecognition||window.webkitSpeechRecognition;
function speak(t){try{const u=new SpeechSynthesisUtterance(String(t).replace(/https?:\S+/g,'').replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF]/gu,'').slice(0,240));u.lang='id-ID';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function bcAdd(w,t){const b=$('#bcl');if(b){b.insertAdjacentHTML('beforeend',`<div class="bcm ${w}">${esc(t)}</div>`);b.scrollTop=b.scrollHeight}}
function botEcho(t){if(!bcOn)return;bcAdd('bot',t);speak(t)}
function bcSay(t){bcAdd('me',t);if(t[0]==='/')runBot(t);else botNL(t)}
function bcMic(){if(!SRec)return toast('Perekam suara tidak didukung browser ini, ketik saja');if(bcRec){bcRec.stop();return}const r=bcRec=new SRec();r.lang='id-ID';r.interimResults=false;r.onresult=e=>bcSay(e.results[0][0].transcript);r.onend=()=>{bcRec=null;const m=$('#bcm');if(m)m.classList.remove('on')};r.onerror=()=>{};const m=$('#bcm');if(m)m.classList.add('on');try{r.start()}catch(e){}}
function botCall(stream){
  if(bcOn||pc)return;bcOn=true;bcSec=0;
  const o=document.createElement('div');o.className='ov';o.id='bcall';o.style.cssText='z-index:62;background:#000;color:#fff;overflow:hidden';
  o.innerHTML=`<div style="position:absolute;inset:-40px;background:url(${botAv()}) center/cover;filter:blur(38px) brightness(.5)"></div><div style="position:relative;z-index:1;display:flex;flex-direction:column;height:100%;padding:14px 16px 24px"><div style="text-align:center;margin-top:${stream?'210px':'30px'}"><img class="av" src="${esc(botAv())}" style="width:84px;height:84px;margin:auto;object-fit:cover"><div style="font-size:24px;font-weight:600;margin-top:8px">${esc(botName())}</div><div id="bct" style="opacity:.8">00:00</div></div><div id="bcl" class="bcl"></div><div style="display:flex;gap:8px;align-items:center"><input class="f" id="bci" placeholder="Ketik atau ucapkan perintah..." style="flex:1;background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.25)"><div class="cb sm" id="bcm" onclick="bcMic()">${I('mic',24,'#fff')}</div></div><div style="display:flex;justify-content:center;margin-top:14px"><div class="cb" style="background:#ff3b30" onclick="botHang()"><span style="display:flex;transform:rotate(135deg)">${I('phone',30,'#fff')}</span></div></div></div>`;
  document.body.appendChild(o);
  bcT=setInterval(()=>{bcSec++;const e=$('#bct');if(e)e.textContent=String(Math.floor(bcSec/60)).padStart(2,'0')+':'+String(bcSec%60).padStart(2,'0')},1000);
  $('#bci').addEventListener('keydown',e=>{if(e.key==='Enter'){const v=e.target.value.trim();e.target.value='';if(v)bcSay(v)}});
  const hi=stream?'Tersambung! Kirim link YouTube, atau bilang: nonton diikuti judulnya.':'Halo, aku '+botName()+'. Mau dengerin lagu atau nonton video? Bilang aja.';
  setTimeout(()=>{bcAdd('bot',hi);speak(hi)},500);
}
function botHang(){
  clearInterval(bcT);try{if(bcRec)bcRec.stop()}catch(e){}try{speechSynthesis.cancel()}catch(e){}
  const o=$('#bcall');if(o)o.remove();const sec=bcSec;bcOn=false;
  if(cur&&isBotChat(cur))sb.from('messages').insert({chat_id:cur,type:'call',body:'Panggilan bot · '+Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}).select().single().then(r=>r.data&&addMsg(r.data));
}
function botRing(){
  if(bcOn||pc||$('#bring'))return;const o=document.createElement('div');o.id='bring';o.className='ov';o.style.cssText='z-index:61;background:#000;color:#fff;overflow:hidden';
  o.innerHTML=`<div style="position:absolute;inset:-40px;background:url(${botAv()}) center/cover;filter:blur(38px) brightness(.55)"></div><div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;height:100%;padding:70px 20px 44px"><div style="font-size:30px;font-weight:600">${esc(botName())}</div><div style="font-size:18px;opacity:.8;margin-top:6px">Panggilan suara masuk</div><div style="flex:1;display:flex;align-items:center"><img class="av" src="${esc(botAv())}" style="width:140px;height:140px;object-fit:cover"></div><div style="display:flex;gap:40px"><div style="text-align:center"><div class="cb" id="bd" style="background:#ff3b30"><span style="display:flex;transform:rotate(135deg)">${I('phone',30,'#fff')}</span></div><div style="font-size:13px;margin-top:6px">Tolak</div></div><div style="text-align:center"><div class="cb" id="ba" style="background:#34c759">${I('phone',30,'#fff')}</div><div style="font-size:13px;margin-top:6px">Terima</div></div></div></div>`;
  document.body.appendChild(o);ring(true,'in');
  const end=()=>{ring(false);o.remove()};
  o.querySelector('#ba').onclick=()=>{end();botCall(false)};o.querySelector('#bd').onclick=end;setTimeout(()=>{if($('#bring'))end()},30000);
}

if(window.visualViewport)visualViewport.addEventListener('resize',()=>{const c=$('#chat');if(c)c.style.height=visualViewport.height+'px'});
applyTheme();
