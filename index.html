<title>Association</title>
<style>
:root{--bg:#fff;--gb:#f2f2f7;--cd:#fff;--tx:#000;--tx2:#8a8a8e;--line:#d1d1d6;--acc:#007aff;--grn:#25d366;--in:#fff;--out:#dcf8c6;--bar:rgba(249,249,249,.94);--wpd:#ece5dd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--gb:#000;--cd:#1c1c1e;--tx:#fff;--tx2:#8d8d93;--line:#38383a;--in:#262d31;--out:#056162;--bar:rgba(29,29,29,.94);--wpd:#0d1418;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--gb:#000;--cd:#1c1c1e;--tx:#fff;--tx2:#8d8d93;--line:#38383a;--in:#262d31;--out:#056162;--bar:rgba(29,29,29,.94);--wpd:#0d1418;color-scheme:dark}
html,body{height:100%;margin:0}
body{position:relative;font:17px -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font-family:inherit}
#app{height:100%;display:flex;flex-direction:column}
#main{flex:1;overflow:auto}
.top{display:flex;justify-content:space-between;align-items:center;padding:4px 10px 0}
.lt{font-size:34px;font-weight:700;margin:2px 16px 8px;letter-spacing:-.3px}
.btn{background:none;border:0;color:var(--acc);font-size:17px;cursor:pointer;padding:8px 6px}
.pill{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-size:16px;font-weight:600;cursor:pointer}
.srch2{margin:0 16px 8px;background:var(--gb);border-radius:10px;padding:0 10px;display:flex;align-items:center;gap:6px;height:36px}
.srch2 input{flex:1;background:none;border:0;color:var(--tx);font:inherit;font-size:17px;outline:0}
:root[data-theme="dark"] .srch2,:root:not([data-theme="light"]) .srch2{background:#1c1c1e}
.chips{display:flex;gap:8px;padding:0 16px 6px;overflow:auto}
.chip{background:var(--gb);border:0;border-radius:16px;padding:6px 14px;color:var(--tx2);font-size:14px;white-space:nowrap}
.chip.on{background:rgba(37,211,102,.2);color:#0a9a45;font-weight:600}
.lnk{color:var(--acc);padding:8px 16px 10px;font-size:17px;cursor:pointer;border-bottom:.5px solid var(--line)}
.item{display:flex;gap:12px;align-items:center;padding:0 0 0 16px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.item:active{background:var(--gb)}
.item .b{flex:1;min-width:0;border-bottom:.5px solid var(--line);padding:9px 16px 9px 0;display:flex;align-items:center;gap:8px}
.item .bm{flex:1;min-width:0}
.t1{font-weight:600;display:flex;align-items:center;gap:4px}
.t2{color:var(--tx2);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{color:var(--tx2);font-size:13px;white-space:nowrap}
.bdg{background:var(--grn);color:#fff;border-radius:11px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;padding:0 6px}
.av{border-radius:50%;object-fit:cover;background:#8e8e93;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.ck{width:16px;height:16px;flex:none}
#tabs{display:flex;border-top:.5px solid var(--line);background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);padding-top:6px}
#tabs button{flex:1;background:none;border:0;padding:0 0 4px;color:var(--tx2);cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
#tabs button small{font-size:10px}
#tabs button.on{color:var(--acc)}
#tabs em{position:absolute;top:-3px;left:calc(50% + 6px);background:#ff3b30;color:#fff;font-style:normal;font-size:12px;min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.ov{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:5}
.hd{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bar);border-bottom:.5px solid var(--line);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);min-height:48px}
.hm{flex:1;min-width:0;cursor:pointer}
.hm .t1{font-size:17px}
.hm .t2{font-size:12px}
.hc{flex:1;text-align:center;font-weight:600}
.back{background:none;border:0;color:var(--acc);display:flex;align-items:center;font-size:17px;padding:4px 0;cursor:pointer;min-width:70px}
.ic{background:none;border:0;cursor:pointer;padding:4px 5px;display:flex;align-items:center}
#msgs{flex:1;overflow:auto;padding:8px 10px;display:flex;flex-direction:column;background:var(--wpd)}
.row{display:flex;flex-direction:column;align-items:flex-start;max-width:80%;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;margin-top:2px}
.row.first{margin-top:8px}
.row.me{align-self:flex-end;align-items:flex-end}
.bub{background:var(--in);color:var(--tx);padding:6px 9px 5px;border-radius:9px;word-break:break-word;white-space:pre-wrap;box-shadow:0 1px .5px rgba(0,0,0,.13);position:relative;font-size:16.5px;line-height:1.28}
.me .bub{background:var(--out)}
.bub.t::before{content:"";position:absolute;top:0;width:9px;height:12px;background:inherit}
.row:not(.me) .bub.t{border-top-left-radius:0}.row:not(.me) .bub.t::before{left:-8px;clip-path:polygon(100% 0,100% 100%,0 0)}
.me .bub.t{border-top-right-radius:0}.me .bub.t::before{right:-8px;clip-path:polygon(0 0,100% 0,0 100%)}
.tt{float:right;margin:7px 0 -3px 10px;font-size:11px;color:var(--tx2);white-space:nowrap;line-height:1}
.bub.im{padding:3px}
.bub.im img,.bub.im video{max-width:100%;max-height:320px;border-radius:7px;display:block}
.bub.im .tt{position:absolute;right:9px;bottom:7px;margin:0;color:#fff;text-shadow:0 0 4px rgba(0,0,0,.7)}
.q{border-left:4px solid var(--grn);background:rgba(0,0,0,.06);border-radius:5px;padding:3px 8px;margin-bottom:4px;font-size:13.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.stk{font-size:88px;line-height:1.1}
.big{font-size:44px;line-height:1.1}
.sys{align-self:center;background:var(--in);color:var(--tx2);font-size:12.5px;border-radius:8px;padding:4px 10px;margin:8px 0;box-shadow:0 1px .5px rgba(0,0,0,.1)}
.who{font-size:13px;font-weight:600;color:#06a07c;display:flex;gap:4px;align-items:center;margin-bottom:1px}
.rx{font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:1px 6px;margin-top:-4px;z-index:1}
.comp{display:flex;gap:4px;align-items:flex-end;padding:6px 6px 8px;background:var(--bar);border-top:.5px solid var(--line)}
.tf{flex:1;display:flex;align-items:flex-end;background:var(--bg);border:.5px solid var(--line);border-radius:19px;padding:0 6px 0 12px;min-height:36px}
.tf textarea{flex:1;border:0;background:none;color:var(--tx);font:inherit;font-size:17px;resize:none;max-height:110px;outline:0;padding:7px 0}
.snd{width:34px;height:34px;border-radius:50%;background:var(--grn);border:0;display:none;align-items:center;justify-content:center;cursor:pointer;margin-bottom:1px}
#pan{height:230px;overflow:auto;background:var(--gb);padding:8px;display:none}
#pan .g{display:grid;grid-template-columns:repeat(8,1fr);font-size:28px;text-align:center}
#pan .g.s{grid-template-columns:repeat(4,1fr);font-size:58px}
#pan .g span{cursor:pointer;padding:4px}
.pt{display:flex;gap:8px;margin-bottom:6px}
.pt button{border:0;background:var(--bg);color:var(--tx);border-radius:14px;padding:4px 12px}
.sheet{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;flex-direction:column;justify-content:flex-end;padding:12px}
.sheet .c{background:var(--cd);border-radius:14px;overflow:hidden;margin-bottom:8px;color:var(--tx)}
.sheet .c>div{padding:15px 16px;border-bottom:.5px solid var(--line);cursor:pointer;text-align:center;color:var(--acc)}
.sheet .c>div:last-child{border:0}
.sheet .c>div.red{color:#ff3b30}
.sheet .rr{display:flex;justify-content:space-around;font-size:30px;padding:10px}
.red{color:#ff3b30}
.form{padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
input.f{border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:10px;padding:11px;font:inherit;width:100%;outline:0}
.gb{flex:1;overflow:auto;background:var(--gb);padding-bottom:30px}
.gp{background:var(--gb)}
.grp{background:var(--cd);border-radius:10px;margin:14px 16px 0;overflow:hidden}
.sec{padding:18px 32px 0;color:var(--tx2);font-size:13px;text-transform:uppercase}
.foot{padding:6px 32px 0;color:var(--tx2);font-size:13px}
.srow{display:flex;align-items:center;gap:14px;padding-left:16px;background:var(--cd);cursor:pointer}
.srow:active{filter:brightness(.95)}
.si{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none}
.sx{flex:1;display:flex;align-items:center;justify-content:space-between;min-height:46px;padding-right:16px;border-bottom:.5px solid var(--line);gap:8px}
.srow:last-child .sx{border:0}
.sr{color:var(--tx2);display:flex;align-items:center;gap:4px}
.tg{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:16px;background:var(--line);position:relative;transition:.2s;flex:none;border:0;outline:0;cursor:pointer}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:.2s}
.tg:checked{background:#34c759}.tg:checked::after{left:22px}
.pf{display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--cd);margin-top:14px;cursor:pointer}
.sw{display:flex;gap:10px;flex-wrap:wrap;padding:14px 16px;background:var(--cd)}
.sw b{width:56px;height:80px;border-radius:10px;display:block;cursor:pointer;border:3px solid transparent}
.sw b.on{border-color:var(--acc)}
.card{background:var(--cd);border-radius:10px;margin:14px 16px 0;padding:12px 16px}
#toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:#333;color:#fff;padding:8px 14px;border-radius:14px;z-index:99;font-size:14px;display:none;max-width:90%;text-align:center}
.stv{align-items:center;justify-content:center;text-align:center;font-size:28px;padding:24px;color:#fff}
.ring{padding:2px;border-radius:50%;background:linear-gradient(135deg,#25d366,#00a884)}
.ring .av{border:2px solid var(--bg)}
.emp{text-align:center;color:var(--tx2);padding:40px 20px}
.notes{display:flex;gap:14px;overflow-x:auto;padding:40px 16px 8px}
.nt{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;cursor:pointer;flex:none;width:76px}
.nt small{font-size:12px;color:var(--tx2);max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb{position:absolute;top:-34px;left:50%;transform:translateX(-30%);background:var(--cd);color:var(--tx);border-radius:14px;padding:5px 9px;font-size:12px;max-width:100px;box-shadow:0 1px 4px rgba(0,0,0,.25);z-index:1;line-height:1.2;word-break:break-word;border:.5px solid var(--line)}
.nb.add{color:var(--tx2)}
.nbig{display:flex;align-items:flex-end;gap:10px;justify-content:center;margin:14px 0}
.nbub{background:#e11d48;color:#fff;border-radius:22px;padding:14px 18px;font-size:19px;text-align:left;max-width:240px;word-break:break-word}
.rp{display:flex;gap:8px;align-items:center;margin-top:12px}
.rp input{flex:1;border:0;background:var(--gb);color:var(--tx);border-radius:20px;padding:10px 14px;font:inherit;outline:0}
.rp span{font-size:26px;cursor:pointer}
.eye{position:absolute;left:0;right:0;bottom:0;padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:6px;font-size:15px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));cursor:pointer}
#splash{position:absolute;inset:0;z-index:100;background:#05070b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s}
.logo{width:92px;height:92px;border-radius:50%;background:#000;overflow:hidden;box-shadow:0 0 0 2px rgba(225,29,72,.7);animation:pop .8s cubic-bezier(.2,1.4,.4,1) both;position:relative}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.logo::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(225,29,72,.55);animation:ring 1.8s ease-out infinite}
.wm{color:#fff;font-size:15px;letter-spacing:.42em;font-weight:600;animation:rise .7s .35s both}
@keyframes pop{from{transform:scale(.3) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@keyframes ring{from{transform:scale(.9);opacity:.9}to{transform:scale(1.5);opacity:0}}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.lx{background:#05070b;color:#fff;justify-content:flex-end;overflow:hidden;z-index:50}
.lx-art{position:absolute;top:0;left:0;width:100%;height:70%;object-fit:cover;object-position:50% 35%;animation:fade 1.4s both}
.lx-fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,11,.25) 0%,rgba(5,7,11,0) 28%,#05070b 64%)}
.lx-c{position:relative;padding:0 24px 28px;display:flex;flex-direction:column;gap:10px;animation:rise .7s .2s both}
.lx-brand{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.42em;font-weight:600;opacity:.9}
.lx-brand img{width:28px;height:28px;border-radius:50%;object-fit:cover}
.lx-t{font-size:34px;font-weight:700;line-height:1.1;margin:6px 0 14px;letter-spacing:-.5px}
.lx-b{display:flex;align-items:center;gap:12px;background:transparent;border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:12px;padding:14px 16px;font:inherit;font-size:16px;font-weight:500;cursor:pointer}
.lx-b:active{background:rgba(255,255,255,.08)}
.lx-b svg{width:20px;height:20px;flex:none}
.lx-s{display:flex;align-items:center;gap:12px;background:#c8102e;border:0;color:#fff;border-radius:12px;padding:12px 14px;font:inherit;font-size:16px;text-align:left;cursor:pointer}
.lx-s .sa{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:700;flex:none}
.lx-s .sa img{width:100%;height:100%;object-fit:cover}
.lx-s>span:nth-child(2){flex:1;min-width:0}
.lx-s small{display:block;opacity:.8}
.lx-s i{font-style:normal;opacity:.75;padding:6px}
.lx-f{font-size:12px;color:rgba(255,255,255,.45);margin-top:4px}
.intro{position:absolute;inset:0;z-index:90;background:#05070b;transition:opacity .6s;animation:fade .4s both}
.intro video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.iv-sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 30%,transparent 50%,rgba(0,0,0,.85))}
.iv-skip,.iv-snd{position:absolute;top:12px;border:0;background:rgba(0,0,0,.45);color:#fff;border-radius:16px;padding:6px 14px;font-size:14px}
.iv-skip{right:12px}.iv-snd{left:12px}
.iv-hint{position:absolute;top:56px;left:50%;transform:translateX(-50%);background:rgba(225,29,72,.92);color:#fff;border-radius:18px;padding:8px 16px;font-size:14px;display:none;animation:rise .4s both;white-space:nowrap}
.iv-b{position:absolute;left:0;right:0;bottom:0;padding:20px 20px 28px;color:#fff;display:flex;flex-direction:column;gap:14px}
.iv-n{display:flex;gap:12px;align-items:center}
.iv-p{height:4px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden}
.iv-p i{display:block;height:100%;width:0;background:#e11d48;border-radius:2px;transition:width .2s linear}
.iv-t{display:flex;justify-content:space-between;font-size:12.5px;color:rgba(255,255,255,.75);font-variant-numeric:tabular-nums}
.np{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#075e54;color:#fff}
.np:empty{display:none}
.npt{flex:1;min-width:0}.npt b,.npt small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npt small{opacity:.8;font-size:12px}
.np button{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:14px;padding:6px 11px;font-size:16px;cursor:pointer}
</style>
</head>

function stopLocal(){A.pause();A.removeAttribute('src');try{A.load()}catch(e){}delete A.dataset.u;AR=null;renderNP()}
function applyRoom(id,st){
  const r=rooms[id];if(!r)return;r.st=st;
  if(r.off||(AR&&AR!==id)){renderNP();return}
  if(!st.now){if(AR===id)stopLocal();renderNP();return}
  AR=id;r.tap=false;
  if(A.dataset.u!==st.now.url){A.src=st.now.url;A.dataset.u=st.now.url}
  const seek=()=>{try{if(Math.abs(A.currentTime-st.pos)>1.5)A.currentTime=st.pos}catch(e){}};
  A.readyState>0?seek():A.addEventListener('loadedmetadata',seek,{once:true});
  if(st.playing){const pl=A.play();if(pl&&pl.catch)pl.catch(()=>{r.tap=true;renderNP()})}else A.pause();
  renderNP();
}
A.onended=()=>{const r=AR&&rooms[AR];if(!r||!r.st||!r.st.now)return;const s=r.st,nx=s.q[0];applyRoom(AR,nx?{now:nx,q:s.q.slice(1),playing:true,pos:0}:{now:null,q:[],playing:false,pos:0})};
function joinRoom(id){
  if(rooms[id])return;const r=rooms[id]={st:null,off:false,tap:false};
  r.ch=sb.channel('room-'+id).on('broadcast',{event:'r'},({payload})=>onRoom(id,payload)).subscribe(s=>{if(s==='SUBSCRIBED')r.ch.send({type:'broadcast',event:'r',payload:{k:'ask',from:me.id}})});
}
function onRoom(id,p){
  const r=rooms[id];if(!r||!p)return;
  if(p.k==='ask'){if(p.from!==me.id&&AR===id&&r.st&&r.st.now)setTimeout(()=>r.ch.send({type:'broadcast',event:'r',payload:{k:'state',st:{...r.st,pos:A.currentTime,playing:!A.paused}}}),Math.random()*600)}

}
function roomSend(id,st){const r=rooms[id];if(!r)return;r.off=false;r.ch.send({type:'broadcast',event:'r',payload:{k:'state',st}});applyRoom(id,st)}
function rctl(id,act,viaCmd){
  const r=rooms[id],st=r&&r.st,say=b=>{if(viaCmd&&cur===id)send({type:'bot',body:b})};
  if(!st||!st.now)return say('Tidak ada yang diputar. Ketik /play judul.');

  const pos=AR===id?A.currentTime:st.pos;

  else if(act==='resume')roomSend(id,{...st,playing:true,pos});
  else if(act==='skip')st.q.length?roomSend(id,{now:st.q[0],q:st.q.slice(1),playing:true,pos:0}):roomSend(id,{now:null,q:[],playing:false,pos:0});

}
function leaveRoom(id){const r=rooms[id];if(!r)return;r.off=true;if(AR===id)stopLocal();renderNP()}

/* ---------- pembaruan: catatan + status ---------- */
const SBG=['#00a884','#0a84ff','#ff2d55','#af52de','#ff9500','#1c1c1e'];
const live=()=>S.filter(s=>Date.now()-tm(s.created_at)<864e5);
function statusTab(m){
  const notes={},by={};live().forEach(s=>{if(s.kind==='note'){if(!notes[s.user_id])notes[s.user_id]=s}else(by[s.user_id]=by[s.user_id]||[]).push(s)});
  const cell=(id,n)=>`<div class="nt" data-n="${id}">${n?`<div class="nb">${n.music_title?I('music',11)+' ':''}${esc(n.body)}</div>`:id===me.id?'<div class="nb add">＋ Catatan</div>':''}${av(id,64)}<small>${id===me.id?'Catatan Anda':esc((P[id]||{}).name)}</small></div>`;
  const nids=[me.id,...Object.keys(notes).filter(i=>i!==me.id)];
  const mine=by[me.id]||[],views=SVW.filter(v=>mine.find(s=>s.id===v.status_id)).length,ids=Object.keys(by).filter(i=>i!==me.id);
  m.innerHTML=`<div class="lt" style="margin-top:12px">Pembaruan</div><div class="notes">${nids.map(i=>cell(i,notes[i])).join('')}</div><div class="sec" style="padding-top:6px">Status</div><div class="item" id="ms" style="margin-top:6px">${mine.length?`<div class="ring">${av(me.id,48)}</div>`:av(me.id,52)}<div class="b"><div class="bm"><div class="t1">Status saya ${vb(me.id)?ck:''}</div><div class="t2">${mine.length?mine.length+' status · '+views+' dilihat':'Ketuk ＋ buat posting (hilang dalam 24 jam)'}</div></div><button class="ic" id="ad">${I('plus',26,'var(--acc)')}</button></div></div>`+(ids.length?ids.map(i=>`<div class="item" data-u="${i}"><div class="ring">${av(i,48)}</div><div class="b"><div class="bm"><div class="t1">${nm(i)}</div><div class="t2">${ago(by[i][0].created_at)} lalu</div></div></div></div>`).join(''):'<div class="emp">Belum ada status dari orang lain</div>');
  m.querySelectorAll('[data-n]').forEach(e=>e.onclick=()=>{const id=e.dataset.n;if(id===me.id&&!notes[id])noteForm();else if(notes[id])noteView(id,notes[id])});
  $('#ad').onclick=e=>{e.stopPropagation();sheet([['Status teks (bisa pakai musik)',textStatus],['Status foto',()=>storyPhoto(false)]])};
  $('#ms').onclick=()=>mine.length&&viewStatus(mine);
  m.querySelectorAll('[data-u]').forEach(e=>e.onclick=()=>viewStatus(by[e.dataset.u]));
}
async function pickMusic(){const f=await pick('audio/*');if(!f)return null;if(f.size>12e6){toast('Musik maksimal 12 MB');return null}toast('Mengunggah musik...');try{const url=await upload(f,'music',(f.name.split('.').pop()||'mp3').toLowerCase());toast('Musik siap');return{url,title:f.name.replace(/\.[^.]+$/,'').slice(0,28)}}catch(e){toast('Gagal unggah musik');return null}}
async function storyPhoto(cap){const f=await pick('image/*',cap);if(!f)return;toast('Mengunggah...');try{const u=await upload(await rz(f,1080,.8),'status','jpg');const r=await sb.from('statuses').insert({media_url:u,kind:'story'});if(r.error)throw r.error;tab='status';await loadAll();render();toast('Status diposting')}catch(e){toast('Gagal posting')}}
function noteForm(){
  let mu=null;const o=document.createElement('div');o.className='sheet';
  o.innerHTML=`<div class="c" style="padding:16px"><div class="t1" style="justify-content:center;margin-bottom:10px">Catatan baru</div><input class="f" id="nt" maxlength="60" placeholder="Bagikan sesuatu... (maks 60 huruf)"><div style="display:flex;gap:8px;margin-top:12px"><button class="pill" id="nm" style="flex:1;background:var(--gb);color:var(--tx)">${I('music',16)} Tambah musik</button><button class="pill" id="ns" style="flex:1">Bagikan</button></div><div class="t2" style="margin-top:8px;text-align:center">Hilang otomatis dalam 24 jam</div></div>`;
  document.body.appendChild(o);o.onclick=e=>{if(e.target===o)o.remove()};
  o.querySelector('#nm').onclick=async()=>{const r=await pickMusic();if(r){mu=r;o.querySelector('#nm').textContent='🎵 '+r.title}};
  o.querySelector('#ns').onclick=async()=>{const t=o.querySelector('#nt').value.trim();if(!t)return toast('Tulis sesuatu dulu');await sb.from('statuses').delete().match({user_id:me.id,kind:'note'});const r=await sb.from('statuses').insert({kind:'note',body:t,music_url:mu&&mu.url,music_title:mu&&mu.title});if(r.error)return toast('Gagal membagikan');o.remove();await loadAll();render()};

function viewStatus(L){
  L=[...L].sort((a,b)=>tm(a.created_at)-tm(b.created_at));let i=0,au=null;const o=document.createElement('div');o.className='ov stv';o.style.zIndex=30;document.body.appendChild(o);

  if(k==='chat'){const o=page('Chat',`<div class="sec">Tema</div><div class="grp">${[['auto','Otomatis'],['light','Terang'],['dark','Gelap']].map(t=>`<div class="srow" data-t="${t[0]}"><div class="sx" style="padding-left:0"><span>${t[1]}</span><span class="sr" style="color:var(--acc)">${pref.theme===t[0]?'✓':''}</span></div></div>`).join('')}</div><div class="sec">Wallpaper chat</div><div class="grp"><div class="sw">${WP.map((w,i)=>`<b data-w="${i}" class="${pref.wp===i?'on':''}" style="background:${w[1]}"></b>`).join('')}</div></div>`,'Pengaturan');o.onclick=e=>{const t=e.target.closest('[data-t]'),w=e.target.closest('[data-w]');if(t){pref.theme=t.dataset.t;applyTheme();o.remove();setPage('chat')}if(w){pref.wp=+w.dataset.w;applyTheme();o.remove();setPage('chat')}};return}
  if(k==='ntf'){page('Notifikasi',`<div class="grp">${trow('Suara pesan masuk',pref.snd!==false,'setSnd')}${trow('Notifikasi browser',!!pref.ntf&&window.Notification&&Notification.permission==='granted','setNtf')}</div><div class="foot">Notifikasi browser hanya muncul saat app terbuka di latar belakang. Notifikasi push saat app tertutup butuh server tambahan.</div>`,'Pengaturan');return}
  if(k==='data'){const o=page('Penyimpanan dan Data',`<div class="grp"><div class="srow" style="cursor:default"><div class="sx" style="padding-left:0"><span>Pesan dimuat</span><span class="sr">${M.length}</span></div></div><div class="srow" style="cursor:default"><div class="sx" style="padding-left:0"><span>Lagu di perpustakaan bot</span><span class="sr">${SG.length}</span></div></div></div><div class="grp"><div class="srow" id="cc"><div class="sx red" style="padding-left:0;justify-content:center">Reset pengaturan di perangkat ini</div></div></div><div class="foot">Mengatur ulang tema, wallpaper, bintang, dan intro. Pesan tetap aman di server.</div>`,'Pengaturan');o.querySelector('#cc').onclick=()=>{['pref','stars','seen','intro_'+me.id].forEach(x=>{try{localStorage.removeItem(x)}catch(e){}});pref={theme:'auto',wp:0,snd:true,ntf:false};stars=[];applyTheme();toast('Pengaturan direset');o.remove()};return}
  if(k==='help'){page('Bantuan',`<div class="card"><b>Association</b><div class="t2" style="white-space:normal;margin-top:6px">Ketik <b>/help</b> di chat mana pun buat lihat perintah bot (putar musik, kelola grup).<br><br>Tahan chat atau pesan untuk menu cepat. Ketuk nama di atas chat untuk info grup/kontak.</div></div>`,'Pengaturan');return}
  if(k==='share'){const url=location.origin+location.pathname,txt='Gabung Association, minta kode undangannya dulu ya: '+url;if(navigator.share)navigator.share({title:'Association',text:txt,url}).catch(()=>{});else{try{await navigator.clipboard.writeText(txt)}catch(e){}toast('Link disalin')}}
}
function setBadge(v){sb.from('profiles').update({show_badge:v}).eq('id',me.id).then(r=>{if(r.error)toast('Gagal ubah');else{P[me.id].show_badge=v;render();toast(v?'Centang biru ditampilkan':'Centang biru disembunyikan')}})}
function setSnd(v){pref.snd=v;applyTheme();if(v)ding()}
async function setNtf(v){if(!window.Notification)return toast('Browser tidak mendukung');if(v&&Notification.permission!=='granted'){const p=await Notification.requestPermission();v=p==='granted'}pref.ntf=v;applyTheme();toast(v?'Notifikasi aktif':'Notifikasi mati')}

/* ---------- panggilan (WebRTC, signaling lewat Supabase Realtime) ---------- */
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
async function sg(to,d){let ch=chs[to];if(!ch){ch=chs[to]=sb.channel('call-'+to);await new Promise(r=>ch.subscribe(s=>{if(s==='SUBSCRIBED')r()}))}ch.send({type:'broadcast',event:'sig',payload:{from:me.id,to,...d}})}
const cst=t=>{const e=$('#cs');if(e)e.textContent=t};
function callUI(txt,inc){
  let o=$('#call');if(!o){o=document.createElement('div');o.id='call';o.className='ov stv';o.style.cssText='z-index:60;background:#111;font-size:20px';document.body.appendChild(o)}
  o.innerHTML=`<video id="rv" autoplay playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;${vv?'':'display:none'}"></video><video id="lv" autoplay playsinline muted style="position:absolute;right:12px;top:12px;width:90px;border-radius:12px;${vv?'':'display:none'}"></video><div style="position:relative;z-index:1"><div style="display:flex;justify-content:center">${av(callTo,110)}</div><div style="margin:10px 0;justify-content:center" class="t1">${nm(callTo)}</div><div id="cs" style="font-size:16px;opacity:.8">${txt}</div><div style="margin-top:30px">${inc?'<button class="pill" style="background:#25d366" onclick="answer()">Terima</button> ':''}<button class="pill" style="background:#ff3b30" onclick="hang(1)">${inc?'Tolak':'Akhiri'}</button></div></div>`;
  if(mstream&&vv)$('#lv').srcObject=mstream;if(rstream)$('#rv').srcObject=rstream;
}
async function mk(){
  mstream=await navigator.mediaDevices.getUserMedia({audio:true,video:!!vv});
  pc=new RTCPeerConnection(ICE);rstream=null;mstream.getTracks().forEach(t=>pc.addTrack(t,mstream));
  pc.ontrack=e=>{rstream=e.streams[0];const v=$('#rv');if(v)v.srcObject=rstream;connT=connT||Date.now();cst('Tersambung')};
  pc.onicecandidate=e=>e.candidate&&sg(callTo,{k:'ice',c:e.candidate});
  pc.onconnectionstatechange=()=>{if(pc&&['failed','closed'].includes(pc.connectionState)){toast('Koneksi putus');hang(0)}};
}
async function call(v){
  if(C[cur].is_group)return toast('Panggilan grup belum ada');
  if(!navigator.mediaDevices||pc)return toast('Panggilan tidak didukung di sini');
  callTo=otherOf(cur);callChat=cur;vv=!!v;isCaller=true;connT=0;
  try{callUI('Memanggil...',0);await mk();callUI('Memanggil...',0);const o=await pc.createOffer();await pc.setLocalDescription(o);sg(callTo,{k:'offer',sdp:o,vid:vv})}catch(e){toast('Mic/kamera ditolak atau tidak tersedia');hang(0)}
}
async function sig(d){
  if(!d||d.to!==me.id)return;
  if(d.k==='offer'){if(pc||pend){sg(d.from,{k:'end'});return}callTo=d.from;pend=d;vv=!!d.vid;qIce=[];isCaller=false;callUI(d.vid?'Video call masuk':'Panggilan suara masuk',1)}
  else if(d.k==='answer'&&pc){await pc.setRemoteDescription(d.sdp);flush()}
  else if(d.k==='ice'){pc&&pc.remoteDescription?pc.addIceCandidate(d.c).catch(()=>{}):qIce.push(d.c)}
  else if(d.k==='end'&&d.from===callTo)hang(0,1);
}
const flush=()=>qIce.splice(0).forEach(c=>pc.addIceCandidate(c).catch(()=>{}));
async function answer(){
  try{const o=pend;await mk();callUI('Menyambung...',0);await pc.setRemoteDescription(o.sdp);flush();const a=await pc.createAnswer();await pc.setLocalDescription(a);sg(callTo,{k:'answer',sdp:a})}catch(e){toast('Mic/kamera ditolak');hang(1)}
}
function hang(n,q){
  if(n&&callTo)sg(callTo,{k:'end'});
  if(isCaller&&callChat){const s=connT?Math.round((Date.now()-connT)/1000):0;sb.from('messages').insert({chat_id:callChat,type:'call',body:(vv?'Video call':'Panggilan suara')+' · '+(s?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):'Tidak terjawab')}).select().single().then(r=>r.data&&addMsg(r.data))}
  isCaller=false;const p=pc;pc=null;if(p)p.close();if(mstream)mstream.getTracks().forEach(t=>t.stop());
  mstream=rstream=pend=null;connT=0;qIce=[];const o=$('#call');if(o){o.remove();if(q)toast('Panggilan selesai')}
}
applyTheme();
</script>
